<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mobile Learning App</title>
  <style>
    :root {
      --outer-bg: #030712;
      --app-bg: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* PC 화면 전체 배경 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--outer-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 스마트폰 비율 고정 프레임 (430px) */
    .mobile-app-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px; /* 스마트폰 높이 비율 */
      background-color: var(--app-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* PC 화면일 때 스마트폰 단말기 스타일 적용 */
    @media (min-width: 480px) {
      .mobile-app-frame {
        height: 884px;
        border-radius: 44px;
        border: 10px solid #1e293b;
      }
    }

    /* 앱 헤더 */
    .app-header {
      padding: 16px 20px;
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .app-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .path-badge {
      font-size: 0.75rem;
      background: var(--accent-glow);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* 앱 콘텐츠 스크롤 영역 */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* 레벨/스텝 탭 바 */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .segment-bar {
      display: flex;
      background-color: var(--card-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .segment-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segment-btn.active {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .sub-bar .segment-btn.active {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }

    /* 검색 바 */
    .search-input {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    /* 파일 리스트 */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .file-card:active {
      transform: scale(0.98);
      background-color: rgba(56, 189, 248, 0.1);
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-badge {
      background-color: var(--accent-glow);
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .card-arrow {
      color: var(--text-sub);
      font-size: 0.8rem;
    }

    /* 하단 앱 네비게이션 바 */
    .app-bottom-nav {
      height: 60px;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-sub);
      font-size: 0.7rem;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 30px 0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 휴대폰 전용 화면 영역 -->
  <div class="mobile-app-frame">
    <header class="app-header">
      <h1>Study Mobile Hub</h1>
      <span class="path-badge" id="pathBadge">L1 / S1</span>
    </header>

    <main class="app-content">
      <!-- Level & Step 선택 -->
      <div class="controls-container">
        <div class="segment-bar" id="levelTabs">
          <button class="segment-btn active" onclick="setLevel('level1')">Level 1</button>
          <button class="segment-btn" onclick="setLevel('level2')">Level 2</button>
          <button class="segment-btn" onclick="setLevel('level3')">Level 3</button>
        </div>

        <div class="segment-bar sub-bar" id="stepTabs">
          <button class="segment-btn active" onclick="setStep('step1')">Step 1</button>
          <button class="segment-btn" onclick="setStep('step2')">Step 2</button>
          <button class="segment-btn" onclick="setStep('step3')">Step 3</button>
        </div>
      </div>

      <!-- 빠른 번호 검색 -->
      <input type="number" id="searchInput" class="search-input" placeholder="페이지 번호 검색 (1~30)" oninput="filterFiles()" min="1" max="30" />

      <!-- 파일 리스트 -->
      <div class="file-list" id="fileList"></div>
    </main>

    <!-- 하단 고정 탭 바 -->
    <nav class="app-bottom-nav">
      <div class="nav-item active">
        <span>📱</span>
        <span>메인</span>
      </div>
      <div class="nav-item" onclick="alert('모바일 화면 비율이 적용된 index 페이지입니다.')">
        <span>⚙️</span>
        <span>설정</span>
      </div>
    </nav>
  </div>

  <script>
    let currentLevel = 'level1';
    let currentStep = 'step1';
    const TOTAL_FILES = 30;

    function renderList() {
      const query = document.getElementById('searchInput').value;
      const container = document.getElementById('fileList');
      container.innerHTML = '';

      let count = 0;
      for (let i = 1; i <= TOTAL_FILES; i++) {
        if (query && !String(i).includes(query)) continue;

        count++;
        const card = document.createElement('a');
        card.className = 'file-card';
        card.href = `${currentLevel}/${currentStep}/${i}.html`;
        card.innerHTML = `
          <div class="card-info">
            <span class="card-badge">#${String(i).padStart(2, '0')}</span>
            <span class="card-title">${i}.html</span>
          </div>
          <span class="card-arrow">❯</span>
        `;
        container.appendChild(card);
      }

      if (count === 0) {
        container.innerHTML = '<div class="empty-msg">검색 결과가 없습니다.</div>';
      }

      // 상단 상태 경로 표시 업데이트
      const l = currentLevel.replace('level', '');
      const s = currentStep.replace('step', '');
      document.getElementById('pathBadge').innerText = `L${l} / S${s}`;
    }

    function setLevel(lvl) {
      currentLevel = lvl;
      updateActiveTab('levelTabs', lvl);
      renderList();
    }

    function setStep(stp) {
      currentStep = stp;
      updateActiveTab('stepTabs', stp);
      renderList();
    }

    function filterFiles() {
      renderList();
    }

    function updateActiveTab(groupId, value) {
      const btns = document.getElementById(groupId).querySelectorAll('.segment-btn');
      btns.forEach(btn => {
        if (btn.getAttribute('onclick').includes(`'${value}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // 초기 화면 생성
    renderList();
  </script>
</body>
</html>
