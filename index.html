<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writing Practice - Main Selection</title>
    <style>
        :root { 
            --bg-deep-navy: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --point-yellow: #fde047; /* 진한 노란색 */
            --point-green: #10b981;  /* 선명한 녹색 */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            margin: 0; 
            background: var(--bg-deep-navy); 
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            color: var(--text-main);
        }

        .pad-container { 
            width: 100%; 
            max-width: 950px; /* 패드 화면에 맞는 넓은 너비 */
            padding: 50px 30px;
            display: flex; 
            flex-direction: column; 
            gap: 35px;
        }

        .header { 
            text-align: center; 
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 3.5rem;
            letter-spacing: -1.5px;
            background: linear-gradient(to right, var(--point-yellow), var(--point-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .header p {
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            font-weight: 500;
        }

        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .section-label { 
            font-size: 1.1rem; 
            font-weight: 800; 
            color: var(--point-green); /* 섹션 제목은 그린 */
            margin-bottom: 25px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-label::before {
            content: "";
            width: 4px;
            height: 18px;
            background: var(--point-yellow); /* 라벨 앞 포인트는 옐로우 */
            border-radius: 2px;
        }

        .btn-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
        }

        button { 
            border: 1px solid var(--glass-border); 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 16px; 
            padding: 18px 25px; 
            font-weight: 700; 
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 호버 효과 */
        @media (hover: hover) {
            button:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: var(--text-muted);
            }
        }

        /* 선택된 버튼 스타일: 노란색 테두리와 그림자 */
        button.selected { 
            background: var(--point-yellow); 
            color: var(--bg-deep-navy); 
            border-color: var(--point-yellow); 
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 20px rgba(253, 224, 71, 0.25);
        }

        /* 패드 화면 버튼 너비 최적화 */
        .grade-btn { flex: 1; min-width: 150px; }
        .year-btn { width: calc(20% - 10px); }
        .month-btn { width: calc(25% - 9px); }
        .num-btn { width: calc(12.5% - 11px); min-width: 75px; padding: 15px 0; }

        .footer { 
            margin-top: 20px;
            position: sticky;
            bottom: 40px;
        }

        .btn-start-final { 
            background: linear-gradient(135deg, var(--point-yellow) 0%, #eab308 100%);
            color: #0f172a; 
            padding: 28px; 
            border-radius: 22px; 
            border: none; 
            font-size: 1.6rem; 
            font-weight: 900; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.3s;
            box-shadow: 0 15px 35px rgba(234, 179, 8, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .btn-start-final:active {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>
<div class="pad-container">
    <div class="header">
        <h1>Writing Practice</h1>
        <p>CHOOSE YOUR STUDY MISSION</p>
    </div>
    
    <div class="section-card">
        <span class="section-label">SELECT GRADE</span>
        <div class="btn-group">
            <button class="grade-btn" onclick="select(this, 'grade', 'Grade_1')">고1 (Grade 1)</button>
            <button class="grade-btn" onclick="select(this, 'grade', 'Grade_2')">고2 (Grade 2)</button>
            <button class="grade-btn" onclick="select(this, 'grade', 'Grade_3')">고3 (Grade 3)</button>
        </div>
    </div>

    <div class="section-card">
        <span class="section-label">SELECT YEAR</span>
        <div class="btn-group">
            <button class="year-btn" onclick="select(this, 'year', '2022')">2022</button>
            <button class="year-btn" onclick="select(this, 'year', '2023')">2023</button>
            <button class="year-btn" onclick="select(this, 'year', '2024')">2024</button>
            <button class="year-btn" onclick="select(this, 'year', '2025')">2025</button>
            <button class="year-btn" onclick="select(this, 'year', '2026')">2026</button>
        </div>
    </div>

    <div class="section-card">
        <span class="section-label">SELECT MONTH</span>
        <div class="btn-group">
            <button class="month-btn" onclick="select(this, 'month', 'month_3')">3월 (Mar)</button>
            <button class="month-btn" onclick="select(this, 'month', 'month_6')">6월 (Jun)</button>
            <button class="month-btn" onclick="select(this, 'month', 'month_9')">9월 (Sep)</button>
            <button class="month-btn" onclick="select(this, 'month', 'month_11')">11월 (Nov)</button>
        </div>
    </div>

    <div class="section-card">
        <span class="section-label">QUESTION NUMBER</span>
        <div class="btn-group">
            <button class="num-btn" onclick="select(this, 'num', '20')">20</button>
            <button class="num-btn" onclick="select(this, 'num', '21')">21</button>
            <button class="num-btn" onclick="select(this, 'num', '22')">22</button>
            <button class="num-btn" onclick="select(this, 'num', '23')">23</button>
            <button class="num-btn" onclick="select(this, 'num', '24')">24</button>
            <button class="num-btn" onclick="select(this, 'num', '29')">29</button>
            <button class="num-btn" onclick="select(this, 'num', '30')">30</button>
            <button class="num-btn" onclick="select(this, 'num', '31')">31</button>
            <button class="num-btn" onclick="select(this, 'num', '32')">32</button>
            <button class="num-btn" onclick="select(this, 'num', '33')">33</button>
            <button class="num-btn" onclick="select(this, 'num', '34')">34</button>
            <button class="num-btn" onclick="select(this, 'num', '35')">35</button>
            <button class="num-btn" onclick="select(this, 'num', '36')">36</button>
            <button class="num-btn" onclick="select(this, 'num', '37')">37</button>
            <button class="num-btn" onclick="select(this, 'num', '38')">38</button>
            <button class="num-btn" onclick="select(this, 'num', '39')">39</button>
            <button class="num-btn" onclick="select(this, 'num', '40')">40</button>
        </div>
    </div>

    <div class="footer">
        <button class="btn-start-final" onclick="startLearning()">
            PRACTICE START <span>▶</span>
        </button>
    </div>
</div>

<script>
    let selections = { grade: '', year: '', month: '', num: '' };

    function select(el, type, folderName) {
        const buttons = el.parentElement.querySelectorAll('button');
        buttons.forEach(btn => btn.classList.remove('selected'));
        el.classList.add('selected');
        
        selections[type] = folderName || el.innerText;
    }

    function startLearning() {
        if (!selections.grade || !selections.year || !selections.month || !selections.num) {
            alert('모든 항목을 선택해 주세요! (Please select all options)');
            return;
        }

        const targetPath = `./${selections.grade}/${selections.year}/${selections.month}/${selections.num}.html`;
        window.location.href = targetPath;
    }
</script>
</body>
</html>
