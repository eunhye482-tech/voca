<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chalkboard Writing Class - Cartilage Function</title>
    <style>
        :root {
            --chalkboard: #1e3932; 
            --chalk-white: #ffffff;
            --point-yellow: #fde047; 
            --wood-frame: #451a03; 
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .board-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--chalkboard);
            border: 15px solid var(--wood-frame);
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            position: relative;
        }

        .korean-sentence {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--point-yellow);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
            border-bottom: 1px solid rgba(253, 224, 71, 0.3);
            padding-bottom: 20px;
        }

        .hint-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .hint-word {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .writing-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 15px;
            min-height: 250px;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .blank {
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.4);
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .blank.fixed {
            border-bottom: none;
            cursor: default;
        }

        .word-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--chalk-white);
            opacity: 0;
            pointer-events: none;
        }

        .blank.fixed .word-text,
        .blank.revealed .word-text {
            opacity: 1;
        }

        .blank.revealed {
            border-bottom-color: var(--point-yellow);
        }

        .blank.revealed .word-text {
            color: var(--point-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
        }

        .page-info {
            color: var(--chalk-white);
            font-size: 1.2rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--point-yellow);
            background: transparent;
            color: var(--point-yellow);
            cursor: pointer;
        }

        button:disabled {
            border-color: #4b5563;
            color: #4b5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="board-container">
    <div id="korean-display" class="korean-sentence"></div>
    <div id="hint-display" class="hint-container"></div>
    <div id="writing-display" class="writing-area"></div>

    <div class="controls">
        <button id="prev-btn" onclick="changeQuiz(-1)">PREV</button>
        <div id="page-info" class="page-info">1 / 6</div>
        <button id="next-btn" onclick="changeQuiz(1)">NEXT</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voice = null;
    let utter = new SpeechSynthesisUtterance();

    function loadVoice() {
        const voices = synth.getVoices();
        voice = voices.find(v => v.lang.includes('en-US')) || voices[0];
        const silent = new SpeechSynthesisUtterance("");
        silent.volume = 0;
        synth.speak(silent);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoice;
    }

    function speakFast(text) {
        synth.cancel();
        const cleanText = text.replace(/[.,“”?—]/g, "");
        utter.text = cleanText;
        utter.voice = voice;
        utter.lang = 'en-US';
        utter.rate = 1.1;
        synth.speak(utter);
    }

    const allQuizzes = [
        {
            k: "연골은 관절의 건강한 기능에 아주 중요하며, 특히 그 관절이 당신의 무릎처럼 무게를 지탱한다면 그렇다.",
            h: ["cartilage", "be", "extremely", "important", "for", "the", "healthy", "function", "of", "a", "joint", "especially", "if", "that", "joint", "bear", "weight", "like", "your", "knee"],
            a: [{w:"Cartilage", t:"b"}, {w:"is", t:"b"}, {w:"extremely", t:"b"}, {w:"important", t:"b"}, {w:"for", t:"f"}, {w:"the", t:"b"}, {w:"healthy", t:"b"}, {w:"functioning", t:"b"}, {w:"of", t:"f"}, {w:"a", t:"b"}, {w:"joint,", t:"b"}, {w:"especially", t:"b"}, {w:"if", t:"b"}, {w:"that", t:"b"}, {w:"joint", t:"b"}, {w:"bears", t:"b"}, {w:"weight,", t:"b"}, {w:"like", t:"f"}, {w:"your", t:"b"}, {w:"knee.", t:"b"}]
        },
        {
            k: "길을 걸으며 왼쪽 무릎의 내부 작동 방식을 들여다본다고 잠시 상상해 봐라.",
            h: ["imagine", "for", "a", "moment", "that", "you", "be", "look", "into", "the", "inner", "work", "of", "your", "left", "knee", "as", "you", "walk", "down", "the", "street"],
            a: [{w:"Imagine", t:"b"}, {w:"for", t:"f"}, {w:"a", t:"b"}, {w:"moment", t:"b"}, {w:"that", t:"b"}, {w:"you’re", t:"b"}, {w:"looking", t:"b"}, {w:"into", t:"f"}, {w:"the", t:"b"}, {w:"inner", t:"b"}, {w:"workings", t:"b"}, {w:"of", t:"f"}, {w:"your", t:"b"}, {w:"left", t:"b"}, {w:"knee", t:"b"}, {w:"as", t:"f"}, {w:"you", t:"b"}, {w:"walk", t:"b"}, {w:"down", t:"f"}, {w:"the", t:"b"}, {w:"street.", t:"b"}]
        },
        {
            k: "왼쪽 다리에서 오른쪽 다리로 체중을 옮길 때, 당신의 왼쪽 무릎의 압력이 풀린다.",
            h: ["when", "you", "shift", "your", "weight", "from", "your", "left", "leg", "to", "your", "right", "the", "pressure", "on", "your", "left", "knee", "be", "release"],
            a: [{w:"When", t:"b"}, {w:"you", t:"b"}, {w:"shift", t:"b"}, {w:"your", t:"b"}, {w:"weight", t:"b"}, {w:"from", t:"f"}, {w:"your", t:"b"}, {w:"left", t:"b"}, {w:"leg", t:"b"}, {w:"to", t:"f"}, {w:"your", t:"b"}, {w:"right,", t:"b"}, {w:"the", t:"b"}, {w:"pressure", t:"b"}, {w:"on", t:"f"}, {w:"your", t:"left", t:"b"}, {w:"knee", t:"b"}, {w:"is", t:"b"}, {w:"released.", t:"b"}]
        },
        {
            k: "그러면 연골은 스펀지가 물을 흡수하는 것과 거의 같은 방식으로 윤활액을 ‘흡수’한다.",
            h: ["the", "cartilage", "in", "your", "left", "knee", "then", "drink", "in", "synovial", "fluid", "in", "much", "the", "same", "way", "that", "a", "sponge", "soak", "up", "liquid", "when", "put", "in", "water"],
            a: [{w:"The", t:"b"}, {w:"cartilage", t:"b"}, {w:"in", t:"f"}, {w:"your", t:"b"}, {w:"left", t:"b"}, {w:"knee", t:"b"}, {w:"then", t:"b"}, {w:"“drinks", t:"b"}, {w:"in”", t:"b"}, {w:"synovial", t:"b"}, {w:"fluid,", t:"b"}, {w:"in", t:"f"}, {w:"much", t:"b"}, {w:"the", t:"b"}, {w:"same", t:"b"}, {w:"way", t:"b"}, {w:"that", t:"b"}, {w:"a", t:"b"}, {w:"sponge", t:"b"}, {w:"soaks", t:"b"}, {w:"up", t:"f"}, {w:"liquid", t:"b"}, {w:"when", t:"b"}, {w:"put", t:"b"}, {w:"in", t:"f"}, {w:"water.", t:"b"}]
        },
        {
            k: "체중을 다시 왼쪽 다리로 옮길 때, 윤활액의 상당 부분이 압착되어 연골 밖으로 나간다.",
            h: ["when", "you", "take", "another", "step", "and", "transfer", "the", "weight", "back", "onto", "your", "left", "leg", "much", "of", "the", "fluid", "squeeze", "out", "of", "the", "cartilage"],
            a: [{w:"When", t:"b"}, {w:"you", t:"b"}, {w:"take", t:"b"}, {w:"another", t:"b"}, {w:"step", t:"b"}, {w:"and", t:"b"}, {w:"transfer", t:"b"}, {w:"the", t:"b"}, {w:"weight", t:"b"}, {w:"back", t:"b"}, {w:"onto", t:"f"}, {w:"your", t:"b"}, {w:"left", t:"b"}, {w:"leg,", t:"b"}, {w:"much", t:"b"}, {w:"of", t:"f"}, {w:"the", t:"b"}, {w:"fluid", t:"b"}, {w:"squeezes", t:"b"}, {w:"out", t:"f"}, {w:"of", t:"f"}, {w:"the", t:"b"}, {w:"cartilage.", t:"b"}]
        },
        {
            k: "이러한 윤활액의 압착은 연골이 걷는 것의 반복적인 압력에 부서지지 않고 반응하도록 돕는다.",
            h: ["this", "squeeze", "of", "joint", "fluid", "into", "and", "out", "of", "the", "cartilage", "help", "it", "respond", "to", "the", "off-and-on", "pressure", "of", "walk", "without", "break", "under", "the", "pressure"],
            a: [{w:"This", t:"b"}, {w:"squeezing", t:"b"}, {w:"of", t:"f"}, {w:"joint", t:"b"}, {w:"fluid", t:"b"}, {w:"into", t:"f"}, {w:"and", t:"b"}, {w:"out", t:"f"}, {w:"of", t:"f"}, {w:"the", t:"b"}, {w:"cartilage", t:"b"}, {w:"helps", t:"b"}, {w:"it", t:"b"}, {w:"respond", t:"b"}, {w:"to", t:"f"}, {w:"the", t:"b"}, {w:"off-and-on", t:"b"}, {w:"pressure", t:"b"}, {w:"of", t:"f"}, {w:"walking", t:"b"}, {w:"without", t:"f"}, {w:"breaking", t:"b"}, {w:"under", t:"f"}, {w:"the", t:"b"}, {w:"pressure.", t:"b"}]
        }
    ];

    let currentIdx = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        const quiz = allQuizzes[currentIdx];
        document.getElementById('korean-display').innerText = quiz.k;
        document.getElementById('page-info').innerText = `${currentIdx + 1} / ${allQuizzes.length}`;
        
        const hArea = document.getElementById('hint-display');
        hArea.innerHTML = '';
        shuffle([...quiz.h]).forEach(word => {
            const s = document.createElement('span');
            s.className = 'hint-word';
            s.innerText = word;
            hArea.appendChild(s);
        });

        const wArea = document.getElementById('writing-display');
        wArea.innerHTML = '';
        quiz.a.forEach(item => {
            const box = document.createElement('div');
            box.className = 'word-box';
            const blank = document.createElement('div');
            blank.className = item.t === 'f' ? 'blank fixed' : 'blank';
            
            if(item.t === 'b') {
                blank.onpointerdown = function(e) { 
                    if (!this.classList.contains('revealed')) {
                        speakFast(item.w); 
                        this.classList.add('revealed');
                    }
                };
            }
            blank.innerHTML = `<span class="word-text">${item.w}</span>`;
            box.appendChild(blank);
            wArea.appendChild(box);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === allQuizzes.length - 1;
    }

    function changeQuiz(dir) {
        currentIdx += dir;
        render();
    }

    loadVoice(); 
    render();
</script>

</body>
</html>
