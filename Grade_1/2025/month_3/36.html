<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chalkboard Writing Class - Nonconceptual Thought</title>
    <style>
        :root {
            --chalkboard: #1e3932; 
            --chalk-white: #ffffff;
            --point-yellow: #fde047; 
            --wood-frame: #451a03; 
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .board-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--chalkboard);
            border: 15px solid var(--wood-frame);
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            position: relative;
        }

        .korean-sentence {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--point-yellow);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
            border-bottom: 1px solid rgba(253, 224, 71, 0.3);
            padding-bottom: 20px;
        }

        .hint-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .hint-word {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .writing-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 15px;
            min-height: 250px;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .blank {
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.4);
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .blank.fixed {
            border-bottom: none;
            cursor: default;
        }

        .word-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--chalk-white);
            opacity: 0;
            pointer-events: none;
        }

        .blank.fixed .word-text,
        .blank.revealed .word-text {
            opacity: 1;
        }

        .blank.revealed {
            border-bottom-color: var(--point-yellow);
        }

        .blank.revealed .word-text {
            color: var(--point-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
        }

        .page-info {
            color: var(--chalk-white);
            font-size: 1.2rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--point-yellow);
            background: transparent;
            color: var(--point-yellow);
            cursor: pointer;
        }

        button:disabled {
            border-color: #4b5563;
            color: #4b5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="board-container">
    <div id="korean-display" class="korean-sentence"></div>
    <div id="hint-display" class="hint-container"></div>
    <div id="writing-display" class="writing-area"></div>

    <div class="controls">
        <button id="prev-btn" onclick="changeQuiz(-1)">PREV</button>
        <div id="page-info" class="page-info">1 / 7</div>
        <button id="next-btn" onclick="changeQuiz(1)">NEXT</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voice = null;
    let utter = new SpeechSynthesisUtterance();

    function loadVoice() {
        const voices = synth.getVoices();
        voice = voices.find(v => v.lang.includes('en-US')) || voices[0];
        const silent = new SpeechSynthesisUtterance("");
        silent.volume = 0;
        synth.speak(silent);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoice;
    }

    function speakFast(text) {
        synth.cancel();
        const cleanText = text.replace(/[.,“”?—]/g, "");
        utter.text = cleanText;
        utter.voice = voice;
        utter.lang = 'en-US';
        utter.rate = 1.1;
        synth.speak(utter);
    }

    const allQuizzes = [
        {
            k: "적어도 일부 동물은 언어가 부족함에도 불구하고 사고할 수 있다고 가정해 보자.",
            h: ["let", "assume", "that", "at", "least", "some", "animal", "be", "capable", "of", "think", "despite", "lack", "a", "language"],
            a: [{w:"Let’s", t:"b"}, {w:"assume", t:"b"}, {w:"that", t:"b"}, {w:"at", t:"f"}, {w:"least", t:"b"}, {w:"some", t:"b"}, {w:"animals", t:"b"}, {w:"are", t:"b"}, {w:"capable", t:"b"}, {w:"of", t:"f"}, {w:"thinking", t:"b"}, {w:"despite", t:"f"}, {w:"lacking", t:"b"}, {w:"a", t:"b"}, {w:"language.", t:"b"}]
        },
        {
            k: "이것이 그들이 개념을 가지고 있다고 반드시 의미하지는 않는데, 왜냐하면 사고의 어떤 형태는 비개념적일 수도 있기 때문이다.",
            h: ["this", "do", "not", "necessarily", "mean", "that", "they", "possess", "concept", "for", "some", "form", "of", "thought", "may", "be", "nonconceptual"],
            a: [{w:"This", t:"b"}, {w:"doesn’t", t:"b"}, {w:"necessarily", t:"b"}, {w:"mean", t:"b"}, {w:"that", t:"b"}, {w:"they", t:"b"}, {w:"possess", t:"b"}, {w:"concepts,", t:"b"}, {w:"for", t:"b"}, {w:"some", t:"b"}, {w:"forms", t:"b"}, {w:"of", t:"f"}, {w:"thought", t:"b"}, {w:"may", t:"b"}, {w:"be", t:"b"}, {w:"nonconceptual.", t:"b"}]
        },
        {
            k: "예를 들어, 현재 서 있는 나뭇가지에서 앞쪽 나무의 나뭇가지로 가는 방법을 계획하고 있는 다람쥐를 상상해 볼 수 있다.",
            h: ["we", "can", "imagine", "for", "instance", "a", "squirrel", "who", "be", "plan", "how", "to", "get", "from", "the", "branch", "she", "be", "currently", "stand", "on", "to", "a", "branch", "from", "the", "tree", "in", "front"],
            a: [{w:"We", t:"b"}, {w:"can", t:"b"}, {w:"imagine,", t:"b"}, {w:"for", t:"f"}, {w:"instance,", t:"b"}, {w:"a", t:"b"}, {w:"squirrel", t:"b"}, {w:"who", t:"b"}, {w:"is", t:"b"}, {w:"planning", t:"b"}, {w:"how", t:"b"}, {w:"to", t:"f"}, {w:"get", t:"b"}, {w:"from", t:"f"}, {w:"the", t:"b"}, {w:"branch", t:"b"}, {w:"she’s", t:"b"}, {w:"currently", t:"b"}, {w:"standing", t:"b"}, {w:"on", t:"f"}, {w:"to", t:"f"}, {w:"a", t:"b"}, {w:"branch", t:"b"}, {w:"from", t:"f"}, {w:"the", t:"b"}, {w:"tree", t:"b"}, {w:"in", t:"f"}, {w:"front.", t:"b"}]
        },
        {
            k: "이것을 하기 위해서, 원칙적으로 다람쥐는 나뭇가지의 개념이나 나무의 개념이 필요하지 않다.",
            h: ["to", "do", "this", "in", "principle", "she", "do", "not", "need", "a", "concept", "of", "branch", "nor", "a", "concept", "of", "tree"],
            a: [{w:"To", t:"f"}, {w:"do", t:"b"}, {w:"this,", t:"b"}, {w:"in", t:"f"}, {w:"principle", t:"b"}, {w:"she", t:"b"}, {w:"doesn’t", t:"b"}, {w:"need", t:"b"}, {w:"a", t:"b"}, {w:"concept", t:"b"}, {w:"of", t:"f"}, {w:"branch", t:"b"}, {w:"nor", t:"b"}, {w:"a", t:"b"}, {w:"concept", t:"b"}, {w:"of", t:"f"}, {w:"tree.", t:"b"}]
        },
        {
            k: "이미지로 생각하는 능력, 즉 다양한 경로를 시도해 볼 수 있는 머릿속 지도를 만드는 능력만 가지고 있는 것으로 충분할 수도 있다.",
            h: ["it", "might", "be", "enough", "for", "her", "to", "have", "for", "example", "the", "ability", "to", "think", "in", "image", "to", "make", "a", "mental", "map", "of", "the", "tree", "where", "she", "can", "imagine", "and", "try", "out", "different", "route"],
            a: [{w:"It", t:"b"}, {w:"might", t:"b"}, {w:"be", t:"b"}, {w:"enough", t:"b"}, {w:"for", t:"f"}, {w:"her", t:"b"}, {w:"to", t:"f"}, {w:"have,", t:"b"}, {w:"for", t:"f"}, {w:"example,", t:"b"}, {w:"the", t:"b"}, {w:"ability", t:"b"}, {w:"to", t:"f"}, {w:"think", t:"b"}, {w:"in", t:"f"}, {w:"images;", t:"b"}, {w:"to", t:"f"}, {w:"make", t:"b"}, {w:"a", t:"b"}, {w:"mental", t:"b"}, {w:"map", t:"b"}, {w:"of", t:"f"}, {w:"the", t:"b"}, {w:"tree", t:"b"}, {w:"where", t:"b"}, {w:"she", t:"b"}, {w:"can", t:"b"}, {w:"imagine", t:"b"}, {w:"and", t:"b"}, {w:"try", t:"b"}, {w:"out", t:"f"}, {w:"different", t:"b"}, {w:"routes.", t:"b"}]
        },
        {
            k: "이것은 다람쥐가 개념이 부족하다는 의미가 아니라, 단지 구체적인 사고 형태를 위해 그것들이 필요하지 않다는 것을 의미한다.",
            h: ["this", "do", "not", "imply", "that", "squirrel", "lack", "concept", "simply", "that", "they", "do", "not", "need", "them", "for", "this", "concrete", "form", "of", "think"],
            a: [{w:"This", t:"b"}, {w:"doesn’t", t:"b"}, {w:"imply", t:"b"}, {w:"that", t:"b"}, {w:"squirrels", t:"b"}, {w:"lack", t:"b"}, {w:"concepts,", t:"b"}, {w:"simply", t:"b"}, {w:"that", t:"b"}, {w:"they", t:"b"}, {w:"don’t", t:"b"}, {w:"need", t:"b"}, {w:"them", t:"b"}, {w:"for", t:"f"}, {w:"this", t:"b"}, {w:"concrete", t:"b"}, {w:"form", t:"b"}, {w:"of", t:"f"}, {w:"thinking.", t:"b"}]
        },
        {
            k: "동물이 개념을 가지고 있다고 말하려면 사고 능력뿐만 아니라 어떤 특정한 능력을 가지고 있다는 것을 보여 주어야 한다.",
            h: ["for", "us", "to", "be", "able", "to", "say", "that", "an", "animal", "have", "concept", "we", "have", "to", "show", "not", "just", "that", "she", "be", "capable", "of", "think", "but", "also", "that", "she", "have", "certain", "specific", "ability"],
            a: [{w:"For", t:"f"}, {w:"us", t:"b"}, {w:"to", t:"f"}, {w:"be", t:"b"}, {w:"able", t:"b"}, {w:"to", t:"f"}, {w:"say", t:"b"}, {w:"that", t:"b"}, {w:"an", t:"b"}, {w:"animal", t:"b"}, {w:"has", t:"b"}, {w:"concepts,", t:"b"}, {w:"we", t:"b"}, {w:"have", t:"b"}, {w:"to", t:"f"}, {w:"show", t:"b"}, {w:"not", t:"b"}, {w:"just", t:"b"}, {w:"that", t:"b"}, {w:"she’s", t:"b"}, {w:"capable", t:"b"}, {w:"of", t:"f"}, {w:"thinking,", t:"b"}, {w:"but", t:"b"}, {w:"also", t:"b"}, {w:"that", t:"b"}, {w:"she", t:"b"}, {w:"has", t:"b"}, {w:"certain", t:"b"}, {w:"specific", t:"b"}, {w:"abilities.", t:"b"}]
        }
    ];

    let currentIdx = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        const quiz = allQuizzes[currentIdx];
        document.getElementById('korean-display').innerText = quiz.k;
        document.getElementById('page-info').innerText = `${currentIdx + 1} / ${allQuizzes.length}`;
        
        const hArea = document.getElementById('hint-display');
        hArea.innerHTML = '';
        shuffle([...quiz.h]).forEach(word => {
            const s = document.createElement('span');
            s.className = 'hint-word';
            s.innerText = word;
            hArea.appendChild(s);
        });

        const wArea = document.getElementById('writing-display');
        wArea.innerHTML = '';
        quiz.a.forEach(item => {
            const box = document.createElement('div');
            box.className = 'word-box';
            const blank = document.createElement('div');
            blank.className = item.t === 'f' ? 'blank fixed' : 'blank';
            
            if(item.t === 'b') {
                blank.onpointerdown = function(e) { 
                    if (!this.classList.contains('revealed')) {
                        speakFast(item.w); 
                        this.classList.add('revealed');
                    }
                };
            }
            blank.innerHTML = `<span class="word-text">${item.w}</span>`;
            box.appendChild(blank);
            wArea.appendChild(box);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === allQuizzes.length - 1;
    }

    function changeQuiz(dir) {
        currentIdx += dir;
        render();
    }

    loadVoice(); 
    render();
</script>

</body>
</html>
