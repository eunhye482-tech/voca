<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chalkboard Writing Class - Skin Conductance</title>
    <style>
        :root {
            --chalkboard: #1e3932; 
            --chalk-white: #ffffff;
            --point-yellow: #fde047; 
            --wood-frame: #451a03; 
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .board-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--chalkboard);
            border: 15px solid var(--wood-frame);
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            position: relative;
        }

        .korean-sentence {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--point-yellow);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
            border-bottom: 1px solid rgba(253, 224, 71, 0.3);
            padding-bottom: 20px;
        }

        .hint-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .hint-word {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .writing-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 15px;
            min-height: 250px;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .blank {
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.4);
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .blank.fixed {
            border-bottom: none;
            cursor: default;
        }

        .word-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--chalk-white);
            opacity: 0;
            pointer-events: none;
        }

        .blank.fixed .word-text,
        .blank.revealed .word-text {
            opacity: 1;
        }

        .blank.revealed {
            border-bottom-color: var(--point-yellow);
        }

        .blank.revealed .word-text {
            color: var(--point-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
        }

        .page-info {
            color: var(--chalk-white);
            font-size: 1.2rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--point-yellow);
            background: transparent;
            color: var(--point-yellow);
            cursor: pointer;
        }

        button:disabled {
            border-color: #4b5563;
            color: #4b5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="board-container">
    <div id="korean-display" class="korean-sentence"></div>
    <div id="hint-display" class="hint-container"></div>
    <div id="writing-display" class="writing-area"></div>

    <div class="controls">
        <button id="prev-btn" onclick="changeQuiz(-1)">PREV</button>
        <div id="page-info" class="page-info">1 / 8</div>
        <button id="next-btn" onclick="changeQuiz(1)">NEXT</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voice = null;
    let utter = new SpeechSynthesisUtterance();

    function loadVoice() {
        const voices = synth.getVoices();
        voice = voices.find(v => v.lang.includes('en-US')) || voices[0];
        const silent = new SpeechSynthesisUtterance("");
        silent.volume = 0;
        synth.speak(silent);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoice;
    }

    function speakFast(text) {
        synth.cancel();
        const cleanText = text.replace(/[.,“”?—]/g, "");
        utter.text = cleanText;
        utter.voice = voice;
        utter.lang = 'en-US';
        utter.rate = 1.1;
        synth.speak(utter);
    }

    const allQuizzes = [
        {
            k: "우리의 피부는 우리의 감정에 따라 전기를 꽤 효율적으로 전도한다.",
            h: ["our", "skin", "conduct", "electricity", "more", "or", "less", "efficient", "depend", "upon", "our", "emotion"],
            a: [{w:"Our", t:"b"}, {w:"skin", t:"b"}, {w:"conducts", t:"b"}, {w:"electricity", t:"b"}, {w:"more", t:"b"}, {w:"or", t:"b"}, {w:"less", t:"b"}, {w:"efficiently,", t:"b"}, {w:"depending", t:"b"}, {w:"upon", t:"f"}, {w:"our", t:"b"}, {w:"emotions.", t:"b"}]
        },
        {
            k: "감정적으로 자극받았을 때 몸은 땀을 아주 약간 흘리는데, 너무 적어서 알아차리지 못할 정도이다.",
            h: ["we", "know", "that", "when", "we", "be", "emotionally", "stimulate", "stress", "sad", "any", "intense", "emotion", "really", "our", "body", "sweat", "a", "tiny", "bit", "so", "little", "we", "might", "not", "even", "notice"],
            a: [{w:"We", t:"b"}, {w:"know", t:"b"}, {w:"that", t:"b"}, {w:"when", t:"b"}, {w:"we’re", t:"b"}, {w:"emotionally", t:"b"}, {w:"stimulated—stressed,", t:"b"}, {w:"sad,", t:"b"}, {w:"any", t:"b"}, {w:"intense", t:"b"}, {w:"emotion,", t:"b"}, {w:"really—our", t:"b"}, {w:"bodies", t:"b"}, {w:"sweat", t:"b"}, {w:"a", t:"b"}, {w:"tiny", t:"b"}, {w:"bit,", t:"b"}, {w:"so", t:"b"}, {w:"little", t:"b"}, {w:"we", t:"b"}, {w:"might", t:"b"}, {w:"not", t:"b"}, {w:"even", t:"b"}, {w:"notice.", t:"b"}]
        },
        {
            k: "작은 땀방울이 나타날 때, 우리의 피부는 전기적으로 더 전도력이 있는 상태가 된다.",
            h: ["and", "when", "those", "tiny", "drop", "of", "sweat", "appear", "our", "skin", "get", "more", "electrically", "conductive"],
            a: [{w:"And", t:"b"}, {w:"when", t:"b"}, {w:"those", t:"b"}, {w:"tiny", t:"b"}, {w:"drops", t:"b"}, {w:"of", t:"f"}, {w:"sweat", t:"b"}, {w:"appear,", t:"b"}, {w:"our", t:"b"}, {w:"skin", t:"b"}, {w:"gets", t:"b"}, {w:"more", t:"b"}, {w:"electrically", t:"b"}, {w:"conductive.", t:"b"}]
        },
        {
            k: "이러한 땀샘 활동의 변화는 여러분의 의식이 관여하지 않은 채 일어난다.",
            h: ["this", "change", "in", "sweat", "gland", "activity", "happen", "completely", "without", "your", "conscious", "mind", "have", "much", "say", "in", "the", "matter"],
            a: [{w:"This", t:"b"}, {w:"change", t:"b"}, {w:"in", t:"f"}, {w:"sweat", t:"b"}, {w:"gland", t:"b"}, {w:"activity", t:"b"}, {w:"happens", t:"b"}, {w:"completely", t:"b"}, {w:"without", t:"f"}, {w:"your", t:"b"}, {w:"conscious", t:"b"}, {w:"mind", t:"b"}, {w:"having", t:"b"}, {w:"much", t:"b"}, {w:"say", t:"b"}, {w:"in", t:"f"}, {w:"the", t:"b"}, {w:"matter.", t:"b"}]
        },
        {
            k: "만약 여러분이 감정적으로 강렬하게 느낀다면, 여러분은 땀샘 활동의 증가를 알아차릴 것이다.",
            h: ["if", "you", "feel", "emotionally", "intense", "you", "be", "go", "to", "notice", "an", "increase", "in", "sweat", "gland", "activity"],
            a: [{w:"If", t:"b"}, {w:"you", t:"b"}, {w:"feel", t:"b"}, {w:"emotionally", t:"intense,", t:"b"}, {w:"intense,", t:"b"}, {w:"you’re", t:"b"}, {w:"going", t:"b"}, {w:"to", t:"f"}, {w:"notice", t:"b"}, {w:"an", t:"b"}, {w:"increase", t:"b"}, {w:"in", t:"f"}, {w:"sweat", t:"b"}, {w:"gland", t:"b"}, {w:"activity.", t:"b"}]
        },
        {
            k: "주관적인 마음 상태에 객관적인 값을 부여할 수 있게 해주기 때문에 과학적 관점에서 유용하다.",
            h: ["this", "be", "particularly", "useful", "from", "a", "scientific", "viewpoint", "because", "it", "allow", "us", "to", "put", "an", "objective", "value", "on", "a", "subjective", "state", "of", "mind"],
            a: [{w:"This", t:"b"}, {w:"is", t:"b"}, {w:"particularly", t:"b"}, {w:"useful", t:"b"}, {w:"from", t:"f"}, {w:"a", t:"b"}, {w:"scientific", t:"b"}, {w:"viewpoint,", t:"b"}, {w:"because", t:"b"}, {w:"it", t:"b"}, {w:"allows", t:"b"}, {w:"us", t:"b"}, {w:"to", t:"f"}, {w:"put", t:"b"}, {w:"an", t:"b"}, {w:"objective", t:"b"}, {w:"value", t:"b"}, {w:"on", t:"f"}, {w:"a", t:"b"}, {w:"subjective", t:"b"}, {w:"state", t:"b"}, {w:"of", t:"f"}, {w:"mind.", t:"b"}]
        },
        {
            k: "우리는 신체가 어떻게 땀을 흘리는지 추적함으로써 여러분의 감정적 상태를 측정할 수 있다.",
            h: ["we", "can", "actually", "measure", "your", "emotional", "state", "by", "track", "how", "your", "body", "subconsciously", "sweat", "by", "run", "a", "bit", "of", "electricity", "through", "your", "skin"],
            a: [{w:"We", t:"b"}, {w:"can", t:"b"}, {w:"actually", t:"b"}, {w:"measure", t:"b"}, {w:"your", t:"b"}, {w:"emotional", t:"b"}, {w:"state", t:"b"}, {w:"by", t:"f"}, {w:"tracking", t:"b"}, {w:"how", t:"b"}, {w:"your", t:"b"}, {w:"body", t:"b"}, {w:"subconsciously", t:"b"}, {w:"sweats,", t:"b"}, {w:"by", t:"f"}, {w:"running", t:"b"}, {w:"a", t:"b"}, {w:"bit", t:"b"}, {w:"of", t:"f"}, {w:"electricity", t:"b"}, {w:"through", t:"f"}, {w:"your", t:"b"}, {w:"skin.", t:"b"}]
        },
        {
            k: "우리는 감정적 강도의 주관적 경험을 객관적인 숫자로 바꿀 수 있다.",
            h: ["we", "can", "then", "turn", "the", "subjective", "subconscious", "experience", "of", "emotional", "intensity", "into", "an", "objective", "number", "by", "figure", "out", "how", "good", "your", "skin", "get", "at", "transfer", "an", "electrical", "current"],
            a: [{w:"We", t:"b"}, {w:"can", t:"b"}, {w:"then", t:"b"}, {w:"turn", t:"b"}, {w:"the", t:"b"}, {w:"subjective,", t:"b"}, {w:"subconscious", t:"b"}, {w:"experience", t:"b"}, {w:"of", t:"f"}, {w:"emotional", t:"b"}, {w:"intensity", t:"b"}, {w:"into", t:"f"}, {w:"an", t:"b"}, {w:"objective", t:"b"}, {w:"number", t:"b"}, {w:"by", t:"f"}, {w:"figuring", t:"b"}, {w:"out", t:"b"}, {w:"how", t:"b"}, {w:"good", t:"b"}, {w:"your", t:"b"}, {w:"skin", t:"b"}, {w:"gets", t:"b"}, {w:"at", t:"f"}, {w:"transferring", t:"b"}, {w:"an", t:"b"}, {w:"electrical", t:"b"}, {w:"current.", t:"b"}]
        }
    ];

    let currentIdx = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        const quiz = allQuizzes[currentIdx];
        document.getElementById('korean-display').innerText = quiz.k;
        document.getElementById('page-info').innerText = `${currentIdx + 1} / ${allQuizzes.length}`;
        
        const hArea = document.getElementById('hint-display');
        hArea.innerHTML = '';
        shuffle([...quiz.h]).forEach(word => {
            const s = document.createElement('span');
            s.className = 'hint-word';
            s.innerText = word;
            hArea.appendChild(s);
        });

        const wArea = document.getElementById('writing-display');
        wArea.innerHTML = '';
        quiz.a.forEach(item => {
            const box = document.createElement('div');
            box.className = 'word-box';
            const blank = document.createElement('div');
            blank.className = item.t === 'f' ? 'blank fixed' : 'blank';
            
            if(item.t === 'b') {
                blank.onpointerdown = function(e) { 
                    if (!this.classList.contains('revealed')) {
                        speakFast(item.w); 
                        this.classList.add('revealed');
                    }
                };
            }
            blank.innerHTML = `<span class="word-text">${item.w}</span>`;
            box.appendChild(blank);
            wArea.appendChild(box);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === allQuizzes.length - 1;
    }

    function changeQuiz(dir) {
        currentIdx += dir;
        render();
    }

    loadVoice(); 
    render();
</script>

</body>
</html>
