<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writing Practice - Subway Behavior</title>
    <style>
        :root {
            --chalkboard: #1e3932; 
            --chalk-white: #ffffff;
            --point-yellow: #fde047; 
            --wood-frame: #451a03; 
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .board-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--chalkboard);
            border: 15px solid var(--wood-frame);
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            position: relative;
        }

        .korean-sentence {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--point-yellow);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
            border-bottom: 1px solid rgba(253, 224, 71, 0.3);
            padding-bottom: 20px;
        }

        .hint-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .hint-word {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .writing-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 15px;
            min-height: 250px;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .blank {
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.4);
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .blank.fixed {
            border-bottom: none;
            cursor: default;
        }

        .word-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--chalk-white);
            opacity: 0;
            pointer-events: none;
        }

        .blank.fixed .word-text,
        .blank.revealed .word-text {
            opacity: 1;
        }

        .blank.revealed {
            border-bottom-color: var(--point-yellow);
        }

        .blank.revealed .word-text {
            color: var(--point-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
        }

        .page-info {
            color: var(--chalk-white);
            font-size: 1.2rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--point-yellow);
            background: transparent;
            color: var(--point-yellow);
            cursor: pointer;
        }

        button:disabled {
            border-color: #4b5563;
            color: #4b5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="board-container">
    <div id="korean-display" class="korean-sentence"></div>
    <div id="hint-display" class="hint-container"></div>
    <div id="writing-display" class="writing-area"></div>

    <div class="controls">
        <button id="prev-btn" onclick="changeQuiz(-1)">PREV</button>
        <div id="page-info" class="page-info">1 / 9</div>
        <button id="next-btn" onclick="changeQuiz(1)">NEXT</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voice = null;
    let utter = new SpeechSynthesisUtterance();

    function loadVoice() {
        const voices = synth.getVoices();
        voice = voices.find(v => v.lang.includes('en-US')) || voices[0];
        const silent = new SpeechSynthesisUtterance("");
        silent.volume = 0;
        synth.speak(silent);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoice;
    }

    function speakFast(text) {
        synth.cancel();
        const cleanText = text.replace(/[.,“”?—]/g, "");
        utter.text = cleanText;
        utter.voice = voice;
        utter.lang = 'en-US';
        utter.rate = 1.1;
        synth.speak(utter);
    }

    const allQuizzes = [
        {
            k: "우리 주변을 살피는 것은 우리 자신 바깥에 있는 것—보고, 듣고, 느끼는 것에 집중하는 것이다.",
            h: ["to", "monitor", "our", "surrounding", "be", "to", "focus", "on", "what", "be", "outside", "of", "ourselves", "what", "we", "see", "hear", "smell", "feel", "and", "perhaps", "even", "taste"],
            a: [{w:"To", t:"f"}, {w:"monitor", t:"b"}, {w:"our", t:"b"}, {w:"surroundings", t:"b"}, {w:"is", t:"b"}, {w:"to", t:"f"}, {w:"focus", t:"b"}, {w:"on", t:"f"}, {w:"what’s", t:"b"}, {w:"outside", t:"b"}, {w:"of", t:"f"}, {w:"ourselves:", t:"b"}, {w:"what", t:"b"}, {w:"we", t:"b"}, {w:"see,", t:"b"}, {w:"hear,", t:"b"}, {w:"smell,", t:"b"}, {w:"feel,", t:"b"}, {w:"and", t:"b"}, {w:"perhaps", t:"b"}, {w:"even", t:"b"}, {w:"taste.", t:"b"}]
        },
        {
            k: "그러나 때로는 장소를 특징짓는 것은 덜 구체적인 것—우리 안에 있는 감정이다.",
            h: ["but", "sometimes", "what", "really", "mark", "a", "place", "be", "something", "less", "specific", "a", "feeling", "within", "us"],
            a: [{w:"But", t:"b"}, {w:"sometimes", t:"b"}, {w:"what", t:"b"}, {w:"really", t:"b"}, {w:"marks", t:"b"}, {w:"a", t:"b"}, {w:"place", t:"b"}, {w:"is", t:"b"}, {w:"something", t:"b"}, {w:"less", t:"b"}, {w:"specific—a", t:"b"}, {w:"feeling", t:"b"}, {w:"within", t:"f"}, {w:"us.", t:"b"}]
        },
        {
            k: "흥미로운 예가 지하철 승객 행동에 관한 연구에서 나왔다.",
            h: ["an", "interesting", "example", "emerge", "from", "a", "study", "of", "subway", "passenger", "behavior"],
            a: [{w:"An", t:"b"}, {w:"interesting", t:"b"}, {w:"example", t:"b"}, {w:"emerged", t:"b"}, {w:"from", t:"f"}, {w:"a", t:"b"}, {w:"study", t:"b"}, {w:"of", t:"f"}, {w:"subway", t:"b"}, {w:"passenger", t:"b"}, {w:"behavior.", t:"b"}]
        },
        {
            k: "연구자들은 사람들이 지하철에서 왜 그 자리에 앉거나 서는지를 형성하는 요인들을 조사했다.",
            h: ["researcher", "try", "to", "understand", "why", "people", "sit", "where", "they", "sit", "or", "stand", "where", "they", "stand", "in", "subway", "and", "metro", "train", "examine", "the", "factor", "that", "shape", "the", "way", "rider", "use", "and", "navigate", "that", "space", "in", "different", "situation"],
            a: [{w:"Researchers", t:"b"}, {w:"trying", t:"b"}, {w:"to", t:"f"}, {w:"understand", t:"b"}, {w:"why", t:"b"}, {w:"people", t:"b"}, {w:"sit", t:"b"}, {w:"where", t:"b"}, {w:"they", t:"b"}, {w:"sit", t:"b"}, {w:"or", t:"b"}, {w:"stand", t:"b"}, {w:"where", t:"b"}, {w:"they", t:"b"}, {w:"stand", t:"b"}, {w:"in", t:"f"}, {w:"subway", t:"b"}, {w:"and", t:"b"}, {w:"metro", t:"b"}, {w:"trains", t:"b"}, {w:"examined", t:"b"}, {w:"the", t:"b"}, {w:"factors", t:"b"}, {w:"that", t:"b"}, {w:"shape", t:"b"}, {w:"the", t:"b"}, {w:"way", t:"b"}, {w:"riders", t:"b"}, {w:"used", t:"b"}, {w:"and", t:"b"}, {w:"navigated", t:"b"}, {w:"that", t:"b"}, {w:"space", t:"b"}, {w:"in", t:"f"}, {w:"different", t:"b"}, {w:"situations.", t:"b"}]
        },
        {
            k: "연구 결과 중 하나는 많은 승객들이 기차 문 근처에 자리 잡기를 좋아하는 이유와 관련 있었다.",
            h: ["one", "of", "their", "finding", "involve", "the", "reason", "many", "rider", "like", "to", "plant", "themselves", "close", "to", "the", "train's", "door"],
            a: [{w:"One", t:"b"}, {w:"of", t:"f"}, {w:"their", t:"b"}, {w:"findings", t:"b"}, {w:"involved", t:"b"}, {w:"the", t:"b"}, {w:"reasons", t:"b"}, {w:"many", t:"b"}, {w:"riders", t:"b"}, {w:"like", t:"b"}, {w:"to", t:"f"}, {w:"plant", t:"b"}, {w:"themselves", t:"b"}, {w:"close", t:"b"}, {w:"to", t:"f"}, {w:"the", t:"b"}, {w:"train’s", t:"b"}, {w:"doors.", t:"b"}]
        },
        {
            k: "부분적으로 이것은 더 빨리 내릴 수 있다는 명확한 편리함 때문이었다.",
            h: ["partly", "this", "be", "the", "obvious", "convenience", "of", "be", "able", "to", "exit", "more", "quickly"],
            a: [{w:"Partly", t:"b"}, {w:"this", t:"b"}, {w:"was", t:"b"}, {w:"the", t:"b"}, {w:"obvious", t:"b"}, {w:"convenience", t:"b"}, {w:"of", t:"f"}, {w:"being", t:"b"}, {w:"able", t:"b"}, {w:"to", t:"f"}, {w:"exit", t:"b"}, {w:"more", t:"b"}, {w:"quickly.", t:"b"}]
        },
        {
            k: "그러나 이는 부분적으로 더 추상적인 느낌—불편한 눈 맞춤을 피하려는 욕구에 의해 형성되었다.",
            h: ["but", "it", "be", "shape", "partly", "by", "a", "more", "abstract", "sensation", "the", "desire", "to", "avoid", "the", "sometimes", "uncomfortable", "feeling", "of", "accidentally", "make", "eye", "contact", "with", "seated", "passenger"],
            a: [{w:"But", t:"b"}, {w:"it", t:"b"}, {w:"was", t:"b"}, {w:"shaped", t:"b"}, {w:"partly", t:"b"}, {w:"by", t:"f"}, {w:"a", t:"b"}, {w:"more", t:"b"}, {w:"abstract", t:"b"}, {w:"sensation—the", t:"b"}, {w:"desire", t:"b"}, {w:"to", t:"f"}, {w:"avoid", t:"b"}, {w:"the", t:"b"}, {w:"sometimes", t:"b"}, {w:"uncomfortable", t:"b"}, {w:"feeling", t:"b"}, {w:"of", t:"f"}, {w:"accidentally", t:"b"}, {w:"making", t:"b"}, {w:"eye", t:"b"}, {w:"contact", t:"b"}, {w:"with", t:"f"}, {w:"seated", t:"b"}, {w:"passengers.", t:"b"}]
        },
        {
            k: "우리는 감정들을 볼 수 없다—그러나 그것들은 매우 실재하며 세상에 대한 경험에 영향을 미친다.",
            h: ["we", "can", "not", "see", "feeling", "but", "they", "be", "very", "real", "and", "they", "influence", "our", "experience", "of", "the", "world"],
            a: [{w:"We", t:"b"}, {w:"can’t", t:"b"}, {w:"see", t:"b"}, {w:"feelings—but", t:"b"}, {w:"they’re", t:"b"}, {w:"very", t:"b"}, {w:"real,", t:"b"}, {w:"and", t:"b"}, {w:"they", t:"b"}, {w:"influence", t:"b"}, {w:"our", t:"b"}, {w:"experience", t:"b"}, {w:"of", t:"f"}, {w:"the", t:"b"}, {w:"world.", t:"b"}]
        }
    ];

    let currentIdx = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        const quiz = allQuizzes[currentIdx];
        document.getElementById('korean-display').innerText = quiz.k;
        document.getElementById('page-info').innerText = `${currentIdx + 1} / ${allQuizzes.length}`;
        
        const hArea = document.getElementById('hint-display');
        hArea.innerHTML = '';
        shuffle([...quiz.h]).forEach(word => {
            const s = document.createElement('span');
            s.className = 'hint-word';
            s.innerText = word;
            hArea.appendChild(s);
        });

        const wArea = document.getElementById('writing-display');
        wArea.innerHTML = '';
        quiz.a.forEach(item => {
            const box = document.createElement('div');
            box.className = 'word-box';
            const blank = document.createElement('div');
            blank.className = item.t === 'f' ? 'blank fixed' : 'blank';
            
            if(item.t === 'b') {
                blank.onpointerdown = function(e) { 
                    if (!this.classList.contains('revealed')) {
                        speakFast(item.w); 
                        this.classList.add('revealed');
                    }
                };
            }
            blank.innerHTML = `<span class="word-text">${item.w}</span>`;
            box.appendChild(blank);
            wArea.appendChild(box);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === allQuizzes.length - 1;
    }

    function changeQuiz(dir) {
        currentIdx += dir;
        render();
    }

    loadVoice(); 
    render();
</script>

</body>
</html>
