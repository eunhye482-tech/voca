<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writing Practice - Truth Bias</title>
    <style>
        :root {
            --chalkboard: #1e3932; 
            --chalk-white: #ffffff;
            --point-yellow: #fde047; 
            --wood-frame: #451a03; 
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .board-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--chalkboard);
            border: 15px solid var(--wood-frame);
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            position: relative;
        }

        .korean-sentence {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--point-yellow);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
            border-bottom: 1px solid rgba(253, 224, 71, 0.3);
            padding-bottom: 20px;
        }

        .hint-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .hint-word {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .writing-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 15px;
            min-height: 250px;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .blank {
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.4);
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .blank.fixed {
            border-bottom: none;
            cursor: default;
        }

        .word-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--chalk-white);
            opacity: 0;
            pointer-events: none;
        }

        .blank.fixed .word-text,
        .blank.revealed .word-text {
            opacity: 1;
        }

        .blank.revealed {
            border-bottom-color: var(--point-yellow);
        }

        .blank.revealed .word-text {
            color: var(--point-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
        }

        .page-info {
            color: var(--chalk-white);
            font-size: 1.2rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--point-yellow);
            background: transparent;
            color: var(--point-yellow);
            cursor: pointer;
        }

        button:disabled {
            border-color: #4b5563;
            color: #4b5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="board-container">
    <div id="korean-display" class="korean-sentence"></div>
    <div id="hint-display" class="hint-container"></div>
    <div id="writing-display" class="writing-area"></div>

    <div class="controls">
        <button id="prev-btn" onclick="changeQuiz(-1)">PREV</button>
        <div id="page-info" class="page-info">1 / 9</div>
        <button id="next-btn" onclick="changeQuiz(1)">NEXT</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voice = null;
    let utter = new SpeechSynthesisUtterance();

    function loadVoice() {
        const voices = synth.getVoices();
        voice = voices.find(v => v.lang.includes('en-US')) || voices[0];
        const silent = new SpeechSynthesisUtterance("");
        silent.volume = 0;
        synth.speak(silent);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoice;
    }

    function speakFast(text) {
        synth.cancel();
        const cleanText = text.replace(/[.,“”?—]/g, "");
        utter.text = cleanText;
        utter.voice = voice;
        utter.lang = 'en-US';
        utter.rate = 1.1;
        synth.speak(utter);
    }

    const allQuizzes = [
        {
            k: "인간이 서로 소통할 때 진실에 대한 자연스러운 가정, 즉 진실 편향이 있다.",
            h: ["there", "be", "a", "natural", "assumption", "of", "truth", "or", "a", "truth", "bias", "when", "human", "communicate", "with", "one", "another"],
            a: [{w:"There", t:"b"}, {w:"is", t:"b"}, {w:"a", t:"b"}, {w:"natural", t:"b"}, {w:"assumption", t:"b"}, {w:"of", t:"f"}, {w:"truth,", t:"b"}, {w:"or", t:"b"}, {w:"a", t:"b"}, {w:"truth", t:"b"}, {w:"bias", t:"b"}, {w:"when", t:"b"}, {w:"humans", t:"b"}, {w:"communicate", t:"b"}, {w:"with", t:"f"}, {w:"one", t:"b"}, {w:"another.", t:"b"}]
        },
        {
            k: "우리가 남의 말을 듣거나 글을 읽을 때, 자동적인 가정은 상대가 진실을 말한다는 것이다.",
            h: ["in", "other", "word", "when", "we", "be", "listen", "to", "other", "or", "read", "their", "word", "our", "automatic", "assumption", "be", "that", "the", "other", "person", "be", "tell", "the", "truth"],
            a: [{w:"In", t:"f"}, {w:"other", t:"b"}, {w:"words,", t:"b"}, {w:"when", t:"b"}, {w:"we’re", t:"b"}, {w:"listening", t:"b"}, {w:"to", t:"f"}, {w:"others", t:"b"}, {w:"or", t:"b"}, {w:"reading", t:"b"}, {w:"their", t:"b"}, {w:"words,", t:"b"}, {w:"our", t:"b"}, {w:"automatic", t:"b"}, {w:"assumption", t:"b"}, {w:"is", t:"b"}, {w:"that", t:"b"}, {w:"the", t:"b"}, {w:"other", t:"b"}, {w:"person", t:"b"}, {w:"is", t:"b"}, {w:"telling", t:"b"}, {w:"the", t:"b"}, {w:"truth.", t:"b"}]
        },
        {
            k: "이는 보통 잘 작동한다.",
            h: ["this", "usually", "work", "out", "fine"],
            a: [{w:"This", t:"b"}, {w:"usually", t:"b"}, {w:"works", t:"b"}, {w:"out", t:"f"}, {w:"fine.", t:"b"}]
        },
        {
            k: "화장실 위치나 날씨를 물을 때, 대부분이 거짓말하지 않을 것이라고 확신하며 가정할 수 있다.",
            h: ["if", "you", "ask", "someone", "where", "the", "restroom", "be", "locate", "or", "if", "it", "be", "rain", "outside", "you", "can", "safely", "assume", "that", "most", "people", "will", "not", "lie", "in", "their", "response"],
            a: [{w:"If", t:"b"}, {w:"you", t:"b"}, {w:"ask", t:"b"}, {w:"someone", t:"b"}, {w:"where", t:"b"}, {w:"the", t:"b"}, {w:"restroom", t:"b"}, {w:"is", t:"b"}, {w:"located", t:"b"}, {w:"or", t:"b"}, {w:"if", t:"b"}, {w:"it’s", t:"b"}, {w:"raining", t:"b"}, {w:"outside,", t:"b"}, {w:"you", t:"b"}, {w:"can", t:"b"}, {w:"safely", t:"b"}, {w:"assume", t:"b"}, {w:"that", t:"b"}, {w:"most", t:"b"}, {w:"people", t:"b"}, {w:"will", t:"b"}, {w:"not", t:"b"}, {w:"lie", t:"b"}, {w:"in", t:"f"}, {w:"their", t:"b"}, {w:"responses.", t:"b"}]
        },
        {
            k: "상대의 모든 말이 거짓이라고 가정한다면 대화가 얼마나 어려울지 상상해 보라!",
            h: ["imagine", "how", "difficult", "it", "would", "be", "to", "converse", "with", "someone", "if", "you", "assume", "that", "everything", "they", "be", "tell", "you", "be", "false"],
            a: [{w:"Imagine", t:"b"}, {w:"how", t:"b"}, {w:"difficult", t:"b"}, {w:"it", t:"b"}, {w:"would", t:"b"}, {w:"be", t:"b"}, {w:"to", t:"f"}, {w:"converse", t:"b"}, {w:"with", t:"f"}, {w:"someone", t:"b"}, {w:"if", t:"b"}, {w:"you", t:"b"}, {w:"assumed", t:"b"}, {w:"that", t:"b"}, {w:"everything", t:"b"}, {w:"they", t:"b"}, {w:"were", t:"b"}, {w:"telling", t:"b"}, {w:"you", t:"b"}, {w:"was", t:"b"}, {w:"false!", t:"b"}]
        },
        {
            k: "진술의 진실성에 의문을 제기하고 믿지 않기로 하는 것은 추가적인 정신적 단계를 요구한다.",
            h: ["indeed", "question", "the", "truth", "of", "a", "statement", "and", "then", "choose", "not", "to", "believe", "it", "require", "additional", "mental", "step"],
            a: [{w:"Indeed,", t:"b"}, {w:"questioning", t:"b"}, {w:"the", t:"b"}, {w:"truth", t:"b"}, {w:"of", t:"f"}, {w:"a", t:"b"}, {w:"statement", t:"b"}, {w:"and", t:"b"}, {w:"then", t:"b"}, {w:"choosing", t:"b"}, {w:"not", t:"b"}, {w:"to", t:"f"}, {w:"believe", t:"b"}, {w:"it", t:"b"}, {w:"requires", t:"b"}, {w:"additional", t:"b"}, {w:"mental", t:"b"}, {w:"steps.", t:"b"}]
        },
        {
            k: "인간은 “인지적 구두쇠”여서 필요한 것보다 더 많은 정신적 노력을 기울이지 않는다.",
            h: ["for", "the", "most", "part", "human", "be", "cognitive", "miser", "which", "mean", "we", "typically", "do", "not", "expend", "more", "mental", "effort", "than", "seem", "necessary", "in", "a", "give", "situation"],
            a: [{w:"For", t:"f"}, {w:"the", t:"b"}, {w:"most", t:"b"}, {w:"part,", t:"b"}, {w:"humans", t:"b"}, {w:"are", t:"b"}, {w:"“cognitive", t:"b"}, {w:"misers,”", t:"b"}, {w:"which", t:"b"}, {w:"means", t:"b"}, {w:"we", t:"b"}, {w:"typically", t:"b"}, {w:"don’t", t:"b"}, {w:"expend", t:"b"}, {w:"more", t:"b"}, {w:"mental", t:"b"}, {w:"effort", t:"b"}, {w:"than", t:"b"}, {w:"seems", t:"b"}, {w:"necessary", t:"b"}, {w:"in", t:"f"}, {w:"a", t:"b"}, {w:"given", t:"b"}, {w:"situation.", t:"b"}]
        },
        {
            k: "가짜여도 적어도 처음에는 믿는 것이 기본값임이 일리가 있다.",
            h: ["it", "make", "sense", "then", "that", "when", "we", "see", "something", "online", "even", "if", "it", "be", "fake", "our", "default", "be", "to", "believe", "it", "at", "least", "at", "first"],
            a: [{w:"It", t:"b"}, {w:"makes", t:"b"}, {w:"sense", t:"b"}, {w:"then,", t:"b"}, {w:"that", t:"b"}, {w:"when", t:"b"}, {w:"we", t:"b"}, {w:"see", t:"b"}, {w:"something", t:"b"}, {w:"online,", t:"b"}, {w:"even", t:"b"}, {w:"if", t:"b"}, {w:"it", t:"b"}, {w:"is", t:"b"}, {w:"fake,", t:"b"}, {w:"our", t:"b"}, {w:"default", t:"b"}, {w:"is", t:"b"}, {w:"to", t:"f"}, {w:"believe", t:"b"}, {w:"it,", t:"b"}, {w:"at", t:"f"}, {w:"least", t:"b"}, {w:"at", t:"f"}, {w:"first.", t:"b"}]
        },
        {
            k: "인간은 정신적 노력을 아끼려는 경향 때문에 정보의 진실성을 의심하지 않으려 한다.",
            h: ["we", "human", "be", "unlikely", "to", "doubt", "the", "truth", "of", "information", "we", "receive", "due", "to", "our", "tendency", "to", "save", "mental", "effort"],
            a: [{w:"We", t:"b"}, {w:"humans", t:"b"}, {w:"are", t:"b"}, {w:"unlikely", t:"b"}, {w:"to", t:"f"}, {w:"doubt", t:"b"}, {w:"the", t:"b"}, {w:"truth", t:"b"}, {w:"of", t:"f"}, {w:"information", t:"b"}, {w:"we", t:"b"}, {w:"receive,", t:"b"}, {w:"due", t:"b"}, {w:"to", t:"f"}, {w:"our", t:"b"}, {w:"tendency", t:"b"}, {w:"to", t:"f"}, {w:"save", t:"b"}, {w:"mental", t:"b"}, {w:"effort.", t:"b"}]
        }
    ];

    let currentIdx = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        const quiz = allQuizzes[currentIdx];
        document.getElementById('korean-display').innerText = quiz.k;
        document.getElementById('page-info').innerText = `${currentIdx + 1} / ${allQuizzes.length}`;
        
        const hArea = document.getElementById('hint-display');
        hArea.innerHTML = '';
        shuffle([...quiz.h]).forEach(word => {
            const s = document.createElement('span');
            s.className = 'hint-word';
            s.innerText = word;
            hArea.appendChild(s);
        });

        const wArea = document.getElementById('writing-display');
        wArea.innerHTML = '';
        quiz.a.forEach(item => {
            const box = document.createElement('div');
            box.className = 'word-box';
            const blank = document.createElement('div');
            blank.className = item.t === 'f' ? 'blank fixed' : 'blank';
            
            if(item.t === 'b') {
                blank.onpointerdown = function(e) { 
                    if (!this.classList.contains('revealed')) {
                        speakFast(item.w); 
                        this.classList.add('revealed');
                    }
                };
            }
            blank.innerHTML = `<span class="word-text">${item.w}</span>`;
            box.appendChild(blank);
            wArea.appendChild(box);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === allQuizzes.length - 1;
    }

    function changeQuiz(dir) {
        currentIdx += dir;
        render();
    }

    loadVoice(); 
    render();
</script>

</body>
</html>
