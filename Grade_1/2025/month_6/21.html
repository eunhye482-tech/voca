<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writing Practice - Beliefs and Behaviors</title>
    <style>
        :root {
            --chalkboard: #1e3932; 
            --chalk-white: #ffffff;
            --point-yellow: #fde047; 
            --wood-frame: #451a03; 
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .board-container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--chalkboard);
            border: 15px solid var(--wood-frame);
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            position: relative;
        }

        .korean-sentence {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--point-yellow);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
            border-bottom: 1px solid rgba(253, 224, 71, 0.3);
            padding-bottom: 20px;
        }

        .hint-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .hint-word {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .writing-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 15px;
            min-height: 250px;
        }

        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .blank {
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.4);
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .blank.fixed {
            border-bottom: none;
            cursor: default;
        }

        .word-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--chalk-white);
            opacity: 0;
            pointer-events: none;
        }

        .blank.fixed .word-text,
        .blank.revealed .word-text {
            opacity: 1;
        }

        .blank.revealed {
            border-bottom-color: var(--point-yellow);
        }

        .blank.revealed .word-text {
            color: var(--point-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            align-items: center;
        }

        .page-info {
            color: var(--chalk-white);
            font-size: 1.2rem;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--point-yellow);
            background: transparent;
            color: var(--point-yellow);
            cursor: pointer;
        }

        button:disabled {
            border-color: #4b5563;
            color: #4b5563;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="board-container">
    <div id="korean-display" class="korean-sentence"></div>
    <div id="hint-display" class="hint-container"></div>
    <div id="writing-display" class="writing-area"></div>

    <div class="controls">
        <button id="prev-btn" onclick="changeQuiz(-1)">PREV</button>
        <div id="page-info" class="page-info">1 / 7</div>
        <button id="next-btn" onclick="changeQuiz(1)">NEXT</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voice = null;
    let utter = new SpeechSynthesisUtterance();

    function loadVoice() {
        const voices = synth.getVoices();
        voice = voices.find(v => v.lang.includes('en-US')) || voices[0];
        const silent = new SpeechSynthesisUtterance("");
        silent.volume = 0;
        synth.speak(silent);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoice;
    }

    function speakFast(text) {
        synth.cancel();
        const cleanText = text.replace(/[.,“”?—]/g, "");
        utter.text = cleanText;
        utter.voice = voice;
        utter.lang = 'en-US';
        utter.rate = 1.1;
        synth.speak(utter);
    }

    const allQuizzes = [
        {
            k: "사람들의 내적 신념이 그들의 외적인 행동을 이끌 수 있다는 것은 상식이다.",
            h: ["it", "be", "common", "sense", "that", "people's", "inner", "belief", "may", "drive", "their", "external", "behavior"],
            a: [{w:"It", t:"b"}, {w:"is", t:"b"}, {w:"common", t:"b"}, {w:"sense", t:"b"}, {w:"that", t:"b"}, {w:"people’s", t:"b"}, {w:"inner", t:"b"}, {w:"beliefs", t:"b"}, {w:"may", t:"b"}, {w:"drive", t:"b"}, {w:"their", t:"b"}, {w:"external", t:"b"}, {w:"behavior.", t:"b"}]
        },
        {
            k: "만약 당신이 어떤 사람에게 끌린다면, 당신은 그 사람과 더 어울리려고 할 것이다.",
            h: ["if", "you", "be", "attract", "to", "a", "certain", "person", "you", "should", "be", "more", "likely", "to", "socialize", "with", "that", "person"],
            a: [{w:"If", t:"b"}, {w:"you’re", t:"b"}, {w:"attracted", t:"b"}, {w:"to", t:"f"}, {w:"a", t:"b"}, {w:"certain", t:"b"}, {w:"person,", t:"b"}, {w:"you", t:"b"}, {w:"should", t:"b"}, {w:"be", t:"b"}, {w:"more", t:"b"}, {w:"likely", t:"b"}, {w:"to", t:"f"}, {w:"socialize", t:"b"}, {w:"with", t:"f"}, {w:"that", t:"b"}, {w:"person.", t:"b"}]
        },
        {
            k: "만약 당신이 한 브랜드의 치약을 선호한다면, 당신이 그것을 구매할 가능성은 더 높다.",
            h: ["if", "you", "favor", "a", "brand", "of", "toothpaste", "you", "be", "more", "likely", "to", "buy", "it"],
            a: [{w:"If", t:"b"}, {w:"you", t:"b"}, {w:"favor", t:"b"}, {w:"a", t:"b"}, {w:"brand", t:"b"}, {w:"of", t:"f"}, {w:"toothpaste,", t:"b"}, {w:"you’re", t:"b"}, {w:"more", t:"b"}, {w:"likely", t:"b"}, {w:"to", t:"f"}, {w:"buy", t:"b"}, {w:"it.", t:"b"}]
        },
        {
            k: "우리의 내적 사고가 항상 행동을 예측하지는 않지만 전반적으로 우리가 하는 것은 우리가 생각하는 바를 반영한다.",
            h: ["of", "course", "our", "internal", "thought", "do", "not", "always", "predict", "our", "public", "behavior", "but", "overall", "what", "we", "do", "obviously", "reflect", "what", "we", "think"],
            a: [{w:"Of", t:"f"}, {w:"course,", t:"b"}, {w:"our", t:"b"}, {w:"internal", t:"b"}, {w:"thoughts", t:"b"}, {w:"don’t", t:"b"}, {w:"always", t:"b"}, {w:"predict", t:"b"}, {w:"our", t:"b"}, {w:"public", t:"b"}, {w:"behavior,", t:"b"}, {w:"but,", t:"b"}, {w:"overall,", t:"b"}, {w:"what", t:"b"}, {w:"we", t:"b"}, {w:"do", t:"b"}, {w:"obviously", t:"b"}, {w:"reflects", t:"b"}, {w:"what", t:"b"}, {w:"we", t:"b"}, {w:"think.", t:"b"}]
        },
        {
            k: "그러나 신념과 행동은 이보다 더 놀라운 방식으로도 관련이 있다.",
            h: ["but", "belief", "and", "behavior", "be", "also", "relate", "in", "a", "more", "remarkable", "way"],
            a: [{w:"But", t:"b"}, {w:"beliefs", t:"b"}, {w:"and", t:"b"}, {w:"behaviors", t:"b"}, {w:"are", t:"b"}, {w:"also", t:"b"}, {w:"related", t:"b"}, {w:"in", t:"f"}, {w:"a", t:"b"}, {w:"more", t:"b"}, {w:"remarkable", t:"b"}, {w:"way.", t:"b"}]
        },
        {
            k: "화살이 반대 방향을 가리킬 가능성이 그만큼 높다는 것이 드러난다.",
            h: ["it", "turn", "out", "that", "the", "arrow", "be", "as", "likely", "to", "point", "in", "the", "reverse", "direction"],
            a: [{w:"It", t:"b"}, {w:"turns", t:"b"}, {w:"out", t:"f"}, {w:"that", t:"b"}, {w:"the", t:"b"}, {w:"arrow", t:"b"}, {w:"is", t:"b"}, {w:"as", t:"b"}, {w:"likely", t:"b"}, {w:"to", t:"f"}, {w:"point", t:"b"}, {w:"in", t:"f"}, {w:"the", t:"b"}, {w:"reverse", t:"b"}, {w:"direction.", t:"b"}]
        },
        {
            k: "우리가 생각하여 행동 방식에 이를 뿐만 아니라 우리가 행동하여 사고 방식에 이를 가능성도 있다.",
            h: ["it", "be", "that", "we", "be", "likely", "not", "only", "to", "think", "ourselves", "into", "a", "way", "of", "act", "but", "also", "to", "act", "ourselves", "into", "a", "way", "of", "think"],
            a: [{w:"it", t:"b"}, {w:"is", t:"b"}, {w:"that", t:"b"}, {w:"we", t:"b"}, {w:"are", t:"b"}, {w:"likely", t:"b"}, {w:"not", t:"b"}, {w:"only", t:"b"}, {w:"to", t:"f"}, {w:"think", t:"b"}, {w:"ourselves", t:"b"}, {w:"into", t:"f"}, {w:"a", t:"b"}, {w:"way", t:"b"}, {w:"of", t:"f"}, {w:"acting", t:"b"}, {w:"but", t:"b"}, {w:"also", t:"b"}, {w:"to", t:"f"}, {w:"act", t:"b"}, {w:"ourselves", t:"b"}, {w:"into", t:"f"}, {w:"a", t:"b"}, {w:"way", t:"b"}, {w:"of", t:"f"}, {w:"thinking.", t:"b"}]
        }
    ];

    let currentIdx = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        const quiz = allQuizzes[currentIdx];
        document.getElementById('korean-display').innerText = quiz.k;
        document.getElementById('page-info').innerText = `${currentIdx + 1} / ${allQuizzes.length}`;
        
        const hArea = document.getElementById('hint-display');
        hArea.innerHTML = '';
        shuffle([...quiz.h]).forEach(word => {
            const s = document.createElement('span');
            s.className = 'hint-word';
            s.innerText = word;
            hArea.appendChild(s);
        });

        const wArea = document.getElementById('writing-display');
        wArea.innerHTML = '';
        quiz.a.forEach(item => {
            const box = document.createElement('div');
            box.className = 'word-box';
            const blank = document.createElement('div');
            blank.className = item.t === 'f' ? 'blank fixed' : 'blank';
            
            if(item.t === 'b') {
                blank.onpointerdown = function(e) { 
                    if (!this.classList.contains('revealed')) {
                        speakFast(item.w); 
                        this.classList.add('revealed');
                    }
                };
            }
            blank.innerHTML = `<span class="word-text">${item.w}</span>`;
            box.appendChild(blank);
            wArea.appendChild(box);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === allQuizzes.length - 1;
    }

    function changeQuiz(dir) {
        currentIdx += dir;
        render();
    }

    loadVoice(); 
    render();
</script>

</body>
</html>
