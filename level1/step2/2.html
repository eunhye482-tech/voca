<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "signal", ko: "신호" },
      { en: "similar", ko: "비슷한" },
      { en: "worse", ko: "더 나쁜" },
      { en: "dig", ko: "파다" },
      { en: "drag", ko: "(질질)끌다" },
      { en: "ladder", ko: "사다리" },
      { en: "electricity", ko: "전기" },
      { en: "spade", ko: "삽" },
      { en: "state", ko: "상태" },
      { en: "whenever", ko: "~할 때 마다" },

      { en: "nap", ko: "낮잠(을 자다)" },
      { en: "opinion", ko: "의견" },
      { en: "item", ko: "품목, 항목" },
      { en: "flat", ko: "평평한" },
      { en: "float", ko: "떠다니다" },
      { en: "score", ko: "점수" },
      { en: "beggar", ko: "거지" },
      { en: "edge", ko: "모서리, 가장자리 끝" },
      { en: "tail", ko: "꼬리" },
      { en: "surface", ko: "표면" },

      { en: "fashion", ko: "유행, 방식" },
      { en: "fur", ko: "모피, 털" },
      { en: "royal", ko: "왕의" },
      { en: "instrument", ko: "도구, 악기" },
      { en: "wizard", ko: "마법사" },
      { en: "refrigerator", ko: "냉장고" },
      { en: "sense", ko: "감각" },
      { en: "leak", ko: "누출(하다), (액체) 새다, (비밀)누설(하다)" },
      { en: "earthquake", ko: "지진" },
      { en: "balance", ko: "균형" },

      { en: "whale", ko: "고래" },
      { en: "last", ko: "마지막의, 지난, 지속하다" },
      { en: "steel", ko: "철강, 강철" },
      { en: "schedule", ko: "일정" },
      { en: "straight", ko: "똑바로" },
      { en: "cotton", ko: "면, 직물" },
      { en: "pole", ko: "극" },
      { en: "boss", ko: "상사" },
      { en: "northern", ko: "북쪽의" },
      { en: "childish", ko: "유치한" },

      { en: "lay", ko: "두다, 놓다, 낳다" },
      { en: "yearly", ko: "매년의, 1년간의" },
      { en: "yearbook", ko: "졸업앨범, 연감" },
      { en: "result", ko: "결과" },
      { en: "shock", ko: "충격(을 주다)" },
      { en: "sword", ko: "칼" },
      { en: "shoulder", ko: "어깨" },
      { en: "serious", ko: "심각한" },
      { en: "straw", ko: "밀짚, 지푸라기, 빨대" },
      { en: "lean", ko: "기대다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
