<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장 (Mobile Web App)</title>
  <style>
    :root {
      --bg-color: #fefcf0;       /* 연한 노란색 바탕 */
      --card-bg: #ffffff;
      --primary-orange: #f57c00; /* 포인트 주황색 */
      --primary-green: #1b5e20;  /* 포인트 진한 녹색 */
      --green-light: #e8f5e9;
      --text-dark: #212121;
      --border-color: #ffe082;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px 12px;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 14px 0;
      margin-bottom: 14px;
      background: #fff8e1;
      border-radius: 16px;
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary-green);
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: var(--primary-orange);
      margin-top: 4px;
      font-weight: 600;
    }

    /* 페이지 네비게이션 (1~5 페이지) */
    .page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 6px;
      background: var(--card-bg);
      padding: 10px 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .page-btn-group {
      display: flex;
      gap: 8px;
    }

    .page-btn {
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--primary-orange);
      background-color: #fff;
      color: var(--primary-orange);
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .page-btn.active {
      background-color: var(--primary-orange);
      color: white;
      box-shadow: 0 2px 6px rgba(245, 124, 0, 0.3);
    }

    .tts-indicator {
      font-size: 0.75rem;
      color: var(--primary-green);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 단어 카드 리스트 */
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      flex: 1;
    }

    .word-card {
      background: var(--card-bg);
      border: 2px solid #ffe082;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      user-select: none;
      transition: transform 0.1s ease, border-color 0.2s ease, background-color 0.2s ease;
      min-height: 58px;
    }

    .word-card:active {
      transform: scale(0.98);
    }

    .word-card.ko-mode {
      background-color: var(--green-light);
      border-color: var(--primary-green);
    }

    .word-index {
      font-size: 0.85rem;
      font-weight: bold;
      color: #9e9e9e;
      width: 26px;
      flex-shrink: 0;
    }

    .word-card.ko-mode .word-index {
      color: var(--primary-green);
    }

    .word-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      flex: 1;
      text-align: left;
      padding: 0 8px;
      word-break: break-word;
    }

    .word-card.ko-mode .word-text {
      color: var(--primary-green);
      font-size: 1.1rem;
    }

    .sound-icon {
      font-size: 1.2rem;
      color: var(--primary-orange);
      flex-shrink: 0;
      opacity: 0.8;
    }

    .word-card.ko-mode .sound-icon {
      color: var(--primary-green);
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888;
      padding: 10px 0;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <!-- 페이지 넘김 버튼 (1 ~ 5 페이지) -->
  <div class="page-nav">
    <div class="page-btn-group" id="page-grid">
      <!-- JS로 1~5 버튼 생성 -->
    </div>
    <div class="tts-indicator">
      <span>🔊 터치 시 발음 재생</span>
    </div>
  </div>

  <!-- 단어 카드 리스트 (10개) -->
  <div class="word-list" id="word-list">
    <!-- JS로 10개 카드가 들어옴 -->
  </div>

  <footer>
    GitHub Pages Ready | iOS & Android TTS Optimized
  </footer>

  <script>
    // 새로 전달받은 이미지 속 50개 단어 데이터
    const wordsData = [
      { en: "surface", ko: "표면" },
      { en: "forehead", ko: "이마" },
      { en: "survey", ko: "조사(하다)" },
      { en: "formation", ko: "형성" },
      { en: "surpass", ko: "능가하다" },
      { en: "fiction", ko: "소설, 허구" },
      { en: "cynical", ko: "냉소적인" },
      { en: "humble", ko: "초라한[미천한], 겸손한" },
      { en: "evil", ko: "사악한[나쁜]" },
      { en: "investigate", ko: "조사하다" },

      { en: "lifespan", ko: "수명" },
      { en: "invest", ko: "투자하다" },
      { en: "vest", ko: "조끼" },
      { en: "supreme", ko: "최고의" },
      { en: "superficial", ko: "피상적인" },
      { en: "spoil", ko: "상하다, 망치다" },
      { en: "superstition", ko: "미신" },
      { en: "arrogant", ko: "거만한[건방진]" },
      { en: "rational", ko: "합리적인[이성적인]" },
      { en: "fume", ko: "연기(가나다)" },

      { en: "perfume", ko: "향기" },
      { en: "irrational", ko: "비합리적인" },
      { en: "lick", ko: "핥다" },
      { en: "lack", ko: "부족[결핍]" },
      { en: "gene", ko: "유전자" },
      { en: "saint", ko: "성인" },
      { en: "genetics", ko: "유전학" },
      { en: "natural", ko: "자연의[자연적인],타고난" },
      { en: "due", ko: "때문에[덕분에], 지불기한인[마감인], 예정인" },
      { en: "alarming", ko: "놀라운" },

      { en: "disorder", ko: "장애, 무질서" },
      { en: "order", ko: "질서[정돈]순서" },
      { en: "insane", ko: "제정신이아닌" },
      { en: "hide", ko: "가죽, 숨기다" },
      { en: "worship", ko: "숭배(하다)" },
      { en: "warship", ko: "군함[전함]" },
      { en: "accord", ko: "일치(하다), 합의" },
      { en: "accordingly", ko: "그에맞게[그에 따라서]" },
      { en: "optimist", ko: "낙천주의자" },
      { en: "pessimist", ko: "비관주의자" },

      { en: "dawn", ko: "시작[새벽,동틀녁]" },
      { en: "dusk", ko: "해질녁[황혼,땅거미]" },
      { en: "inspiration", ko: "영감,격려" },
      { en: "valuable", ko: "가치있는" },
      { en: "lately", ko: "최근에" },
      { en: "description", ko: "묘사[설명]" },
      { en: "shame", ko: "부끄러움[수치심]" },
      { en: "disturb", ko: "방해하다" },
      { en: "prescription", ko: "처방(전)" },
      { en: "beat", ko: "치다[때리다], 이기다[패배시키다], 박자" }
    ];

    let currentPage = 1;
    const cardStates = {};

    // TTS 음성 객체 초기화
    let synth = window.speechSynthesis;
    let englishVoice = null;

    function initVoices() {
      if (!synth) return;
      let voices = synth.getVoices();
      englishVoice = voices.find(v => v.lang === 'en-US') || 
                     voices.find(v => v.lang.startsWith('en')) || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }

    // 발음 재생 함수 (Android & iOS 대응)
    function speakWord(text) {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
        return;
      }

      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      
      if (!englishVoice) {
        initVoices();
      }
      if (englishVoice) {
        utterance.voice = englishVoice;
      }

      synth.speak(utterance);
    }

    // 모바일 터치 오디오 언락
    let audioUnlocked = false;
    function unlockAudio() {
      if (!audioUnlocked && synth) {
        let dummyUtterance = new SpeechSynthesisUtterance("");
        dummyUtterance.volume = 0;
        synth.speak(dummyUtterance);
        audioUnlocked = true;
      }
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    // 페이지 버튼 렌더링 (1 ~ 5)
    function renderPageButtons() {
      const pageGrid = document.getElementById('page-grid');
      pageGrid.innerHTML = '';
      for (let p = 1; p <= 5; p++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
        btn.innerText = p;
        btn.onclick = () => {
          currentPage = p;
          renderPageButtons();
          renderWords();
        };
        pageGrid.appendChild(btn);
      }
    }

    // 단어 목록 렌더링 (10개씩)
    function renderWords() {
      const listContainer = document.getElementById('word-list');
      listContainer.innerHTML = '';

      const startIndex = (currentPage - 1) * 10;
      const pageWords = wordsData.slice(startIndex, startIndex + 10);

      pageWords.forEach((wordObj, idx) => {
        const globalIdx = startIndex + idx;
        const isKoMode = !!cardStates[globalIdx];

        const card = document.createElement('div');
        card.className = `word-card ${isKoMode ? 'ko-mode' : ''}`;
        
        card.innerHTML = `
          <span class="word-index">${globalIdx + 1}</span>
          <span class="word-text">${isKoMode ? wordObj.ko : wordObj.en}</span>
          <span class="sound-icon">${isKoMode ? '🇰🇷' : '🔊'}</span>
        `;

        card.onclick = () => {
          speakWord(wordObj.en);
          cardStates[globalIdx] = !cardStates[globalIdx];
          renderWords();
        };

        listContainer.appendChild(card);
      });
    }

    window.onload = () => {
      initVoices();
      renderPageButtons();
      renderWords();
    };
  </script>
</body>
</html>
