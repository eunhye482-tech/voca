<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "resident", ko: "주민, 거주자" },
      { en: "beneficent", ko: "자비로운, 선을 행하는" },
      { en: "beneficial", ko: "유익한" },
      { en: "sum", ko: "액수, 금액, 합계[총합](하다)" },
      { en: "blossom", ko: "꽃(이 피다), 발전하다" },
      { en: "mortgage", ko: "담보 대출(금)" },
      { en: "warrant", ko: "보증(하다)" },
      { en: "warranty", ko: "품질보증서" },
      { en: "viewpoint", ko: "관점" },
      { en: "kneel", ko: "무릎 꿇다" },

      { en: "administer", ko: "투여하다, 관리하다" },
      { en: "liver", ko: "간" },
      { en: "deliver", ko: "전달하다, (말, 연설, 설교)하다, 분만하다" },
      { en: "delivery", ko: "배달, 분만" },
      { en: "wellbeing", ko: "행복, 복지" },
      { en: "refuge", ko: "피난(처), 쉼터" },
      { en: "pupil", ko: "학생, 눈동자, 동공" },
      { en: "regime", ko: "정권, 체제, 제도" },
      { en: "nostalgia", ko: "향수(고향이나 과거를 그리워함)" },
      { en: "tyrant", ko: "폭군, 독재자" },

      { en: "tyranny", ko: "폭정, 폭압, 독재" },
      { en: "margin", ko: "이윤, 차이, 여백" },
      { en: "marginal", ko: "주변부의, 중요하지 않은" },
      { en: "painkiller", ko: "진통제" },
      { en: "remarkable", ko: "놀라운, 주목할 만한" },
      { en: "uphold", ko: "유지하다, 지지하다" },
      { en: "bliss", ko: "행복" },
      { en: "apt", ko: "~하기 쉬운, ~하는 경향이 있는, 적절한" },
      { en: "correspondence", ko: "일치, 상응, 편지 교환, 통신" },
      { en: "correspondent", ko: "기자, 통신원, 특파원" },

      { en: "upcoming", ko: "다가오는, 이번의" },
      { en: "hybrid", ko: "잡종, 혼합(물)" },
      { en: "collaborative", ko: "협력하는, 공동의" },
      { en: "companionship", ko: "우정, 동료애" },
      { en: "brochure", ko: "(안내, 홍보용)책자" },
      { en: "breeding", ko: "번식" },
      { en: "arctic", ko: "북극(의)" },
      { en: "Antarctic", ko: "남극(의)" },
      { en: "gratitude", ko: "감사" },
      { en: "altitude", ko: "고도, 높이" },

      { en: "latitude", ko: "위도" },
      { en: "attitude", ko: "태도" },
      { en: "longitude", ko: "경도" },
      { en: "aptitude", ko: "적성" },
      { en: "multitude", ko: "다수" },
      { en: "multiply", ko: "증가하다, 번식하다, 곱하다" },
      { en: "multiple", ko: "다양한, 다수의" },
      { en: "multitasking", ko: "다중작업" },
      { en: "misplace", ko: "잘못 두다" },
      { en: "misplaced", ko: "잘못된" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
