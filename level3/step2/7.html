<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "aural", ko: "청각적" },
      { en: "diploma", ko: "졸업증서, 수료증" },
      { en: "diplomat", ko: "외교관" },
      { en: "dispatch", ko: "급히 보내다" },
      { en: "missionary", ko: "선교사, 전도사" },
      { en: "congestion", ko: "혼잡" },
      { en: "grieve", ko: "비통해하다" },
      { en: "grief", ko: "슬픔, 비통함" },
      { en: "swift", ko: "신속한" },
      { en: "bypass", ko: "우회하다, 우회로" },

      { en: "authentic", ko: "믿을 만한, 진짜의, 정통의" },
      { en: "populous", ko: "인구가 많은" },
      { en: "shallow", ko: "얕은, 피상적인, 천박한" },
      { en: "profound", ko: "심오한, 깊은" },
      { en: "recreate", ko: "재현하다, 기운 나게 하다" },
      { en: "reaction", ko: "반응, 반작용, 반발" },
      { en: "unidentified", ko: "미확인된" },
      { en: "unreasonable", ko: "비합리적인" },
      { en: "crude", ko: "가공하지 않은, 원래 그대로의, 대충의, 투박한, 조잡한" },
      { en: "incredible", ko: "믿을 수 없는, 놀라운" },

      { en: "discredit", ko: "믿지 않다, 신용을 떨어뜨리다" },
      { en: "discreet", ko: "신중한, 분별 있는" },
      { en: "inventory", ko: "재고품, 물품 목록" },
      { en: "predominant", ko: "두드러진, 지배적인" },
      { en: "qualify", ko: "자격을 얻다[주다]" },
      { en: "qualified", ko: "자격이 있는, 적격의" },
      { en: "qualification", ko: "자격(증)" },
      { en: "drain", ko: "배수관, 물을 빼다, 고갈시키다" },
      { en: "normal", ko: "표준의, 정상(적인)" },
      { en: "abnormal", ko: "비정상적인" },

      { en: "glimpse", ko: "흘긋 봄, 흘긋 보다" },
      { en: "auction", ko: "경매" },
      { en: "channel", ko: "수단, 수로" },
      { en: "regulate", ko: "규제[통제]하다" },
      { en: "radiate", ko: "발산하다, 내뿜다" },
      { en: "radiant", ko: "빛나는" },
      { en: "radiation", ko: "방사선, 방사능" },
      { en: "promotion", ko: "홍보, 승진" },
      { en: "censor", ko: "검열하다, 검열관" },
      { en: "censorship", ko: "검열" },

      { en: "dine", ko: "(저녁)식사를 하다" },
      { en: "blink", ko: "깜박이다" },
      { en: "remove", ko: "제거하다" },
      { en: "removal", ko: "제거" },
      { en: "drainage", ko: "배수[물 빼기]" },
      { en: "sturdy", ko: "튼튼한" },
      { en: "exile", ko: "추방(하다), 망명(시키다)" },
      { en: "sanitary", ko: "위생적인, 위생의" },
      { en: "mass", ko: "대중, 대량, 덩어리, 양, 질량" },
      { en: "massive", ko: "거대한" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
