<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "landscape", ko: "풍경, 경치" },
      { en: "adorn", ko: "장식하다, 꾸미다" },
      { en: "adornment", ko: "장식(물)" },
      { en: "adore", ko: "매우 좋아하다" },
      { en: "complement", ko: "보완[보충](하다)" },
      { en: "complementary", ko: "보완적인, 보충하는" },
      { en: "compliment", ko: "칭찬(하다)" },
      { en: "complimentary", ko: "칭찬의, 무료의" },
      { en: "lick", ko: "핥다" },
      { en: "blunder", ko: "큰 실수" },

      { en: "blunt", ko: "무딘" },
      { en: "blur", ko: "흐릿하게 하다" },
      { en: "inherent", ko: "내재된, 본질적인" },
      { en: "abundant", ko: "풍부한, 많은" },
      { en: "abundance", ko: "풍부함" },
      { en: "adjustment", ko: "조정, 조절, 적응" },
      { en: "locate", ko: "(위치를) 찾아내다, 위치시키다" },
      { en: "textile", ko: "직물, 옷감" },
      { en: "texture", ko: "질감, 감촉" },
      { en: "verify", ko: "확인[증명]하다" },

      { en: "autonomy", ko: "자치권, 자율성" },
      { en: "astronomy", ko: "천문학" },
      { en: "astronomical", ko: "천문학적인[천문학의]" },
      { en: "astronomer", ko: "천문학자" },
      { en: "astrology", ko: "점성술" },
      { en: "catastrophe", ko: "대참사, 큰 재앙" },
      { en: "logical", ko: "논리적인" },
      { en: "discriminate", ko: "구별하다, 차별하다" },
      { en: "discrimination", ko: "차별, 구별, 식별력" },
      { en: "compensate", ko: "보충[보상]하다" },

      { en: "compensation", ko: "보상(금)" },
      { en: "observatory", ko: "전망대, 관측소, 천문대" },
      { en: "mischief", ko: "장난, 못된 짓" },
      { en: "mischievous", ko: "장난이 심한, 짓궂은" },
      { en: "distress", ko: "고통[가난](을 주다)" },
      { en: "drawback", ko: "결점" },
      { en: "dim", ko: "희미한, 어둑한" },
      { en: "presentation", ko: "수여, 제공, 발표" },
      { en: "presence", ko: "존재, 참석" },
      { en: "representation", ko: "표현, 묘사, 설명" },

      { en: "representative", ko: "대표하는, 대표자" },
      { en: "maintenance", ko: "관리, 유지, 지속" },
      { en: "ventilate", ko: "환기시키다" },
      { en: "ventilation", ko: "환기, 통풍" },
      { en: "feast", ko: "축제, 연회, 잔치" },
      { en: "spear", ko: "창" },
      { en: "salute", ko: "경의를 표하다, 인사하다" },
      { en: "majestic", ko: "위풍당당한, 위엄 있는" },
      { en: "manuscript", ko: "원고" },
      { en: "lyric", ko: "가사, 서정시(의)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
