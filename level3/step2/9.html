<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "encompass", ko: "포함하다, 둘러싸다" },
      { en: "versus", ko: "대비[대립]하는" },
      { en: "diverse", ko: "다양한" },
      { en: "diversity", ko: "다양성" },
      { en: "reverse", ko: "반대(의), 뒤집다, 반대로 하다" },
      { en: "convert", ko: "바꾸다" },
      { en: "anniversary", ko: "기념일" },
      { en: "annual", ko: "연간의, 매년의" },
      { en: "biannual", ko: "연 2회의" },
      { en: "bilingual", ko: "2개 국어를 쓰는" },

      { en: "activate", ko: "활성화[작동]시키다" },
      { en: "exterminate", ko: "제거하다" },
      { en: "deposit", ko: "두다, 예금하다, 예약금, 퇴적시키다, 퇴적물" },
      { en: "fatal", ko: "치명적인, 결정적인" },
      { en: "fate", ko: "운명" },
      { en: "fertile", ko: "비옥한, 풍부한" },
      { en: "fertility", ko: "비옥함, 생산력" },
      { en: "fertilize", ko: "비옥하게[풍요롭게] 하다" },
      { en: "fertilizer", ko: "비료" },
      { en: "barren", ko: "척박한" },

      { en: "behalf", ko: "이익" },
      { en: "on behalf of", ko: "~을 대표하여[위하여]" },
      { en: "adoption", ko: "입양, 채택" },
      { en: "adaptation", ko: "적응, 각색" },
      { en: "alert", ko: "기민한, 방심하지 않는, 경고하다" },
      { en: "outperform", ko: "능가하다" },
      { en: "collide", ko: "충돌하다" },
      { en: "collision", ko: "충돌" },
      { en: "evade", ko: "회피하다" },
      { en: "accord", ko: "일치(하다)" },

      { en: "discord", ko: "불화" },
      { en: "cordial", ko: "진심의[다정한]" },
      { en: "inclined", ko: "경향이 있는, 경사진, 기울어진" },
      { en: "decline", ko: "감소[쇠퇴]하다, 거절하다" },
      { en: "encyclopedia", ko: "백과사전" },
      { en: "advent", ko: "출현, 도래" },
      { en: "assert", ko: "주장[단언]하다" },
      { en: "loan", ko: "대출(금)" },
      { en: "superb", ko: "최고의" },
      { en: "empower", ko: "권한을 주다" },

      { en: "plague", ko: "전염병, 괴롭히다" },
      { en: "rigid", ko: "경직된, 뻣뻣한, 엄격한, 완고한" },
      { en: "administration", ko: "행정, 관리" },
      { en: "dose", ko: "(약의)복용량[투여량, 투여하다]" },
      { en: "coherent", ko: "일관성이 있는" },
      { en: "coherence", ko: "일관성" },
      { en: "cohesion", ko: "화합, 결합, 응집" },
      { en: "cohesive", ko: "화합하는" },
      { en: "eclipse", ko: "가림, 가리다" },
      { en: "magnet", ko: "자석" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
