<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "overwhelming", ko: "압도적인" },
      { en: "overwhelm", ko: "압도하다" },
      { en: "mold", ko: "틀, 거푸집, 곰팡이" },
      { en: "mole", ko: "점" },
      { en: "perfume", ko: "향수, 향기" },
      { en: "drastic", ko: "과감한, 극단적인" },
      { en: "scheme", ko: "계획[음모](하다)" },
      { en: "doomed", ko: "운명인, 운명 지워진, 불운의" },
      { en: "convene", ko: "소집하다, 모이다" },
      { en: "hypothesis", ko: "가설" },

      { en: "hypothetical", ko: "가상적인, 가설에 근거한" },
      { en: "sue", ko: "소송을 제기하다, 고소하다" },
      { en: "ensue", ko: "뒤따르다, 계속 일어나다" },
      { en: "generalize", ko: "일반화하다" },
      { en: "generalization", ko: "일반화" },
      { en: "discipline", ko: "규율[훈련](하다), (학문)분야, 학과" },
      { en: "perplexed", ko: "당혹한, 난처한" },
      { en: "disprove", ko: "반박[반증]하다" },
      { en: "limp", ko: "절뚝거리다, 절뚝거림" },
      { en: "tact", ko: "재치, 요령, 눈치" },

      { en: "tactful", ko: "재치[요령, 눈치]있는" },
      { en: "dense", ko: "빽빽한, 밀집한, 짙은" },
      { en: "density", ko: "밀도, 농도" },
      { en: "prudent", ko: "신중한" },
      { en: "credit", ko: "신용[믿다], 칭찬, 인정, 공로, 학점" },
      { en: "debt", ko: "빚" },
      { en: "debtor", ko: "채무자" },
      { en: "credible", ko: "믿을 만한" },
      { en: "personnel", ko: "인사과[직원, 인원]" },
      { en: "pierce", ko: "(꿰)뚫다" },

      { en: "rite", ko: "의례, 의식" },
      { en: "dominate", ko: "지배하다" },
      { en: "dominant", ko: "지배적인" },
      { en: "domination", ko: "지배(권)" },
      { en: "urbanize", ko: "도시화 하다" },
      { en: "eligible", ko: "자격이 있는, 적격의" },
      { en: "condemn", ko: "비난하다, 선고를 내리다" },
      { en: "population", ko: "인구" },
      { en: "revenge", ko: "보복, 복수" },
      { en: "facility", ko: "시설, 기능" },

      { en: "facilitate", ko: "용이하게[촉진]하다" },
      { en: "facilitation", ko: "촉진, 용이하게 함" },
      { en: "hygiene", ko: "위생, 청결" },
      { en: "reunion", ko: "동창회, 모임, 재결합" },
      { en: "peculiar", ko: "독특한, 이상한" },
      { en: "insistent", ko: "고집하는, 주장하는, 지속적인, 꾸준한" },
      { en: "population", ko: "개체수" },
      { en: "patent", ko: "특허(권)" },
      { en: "pension", ko: "연금" },
      { en: "anchor", ko: "고정시키다, 닻(을 내리다)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
