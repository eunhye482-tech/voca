<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "self-esteem", ko: "자존감(자부심)" },
      { en: "comprehend", ko: "이해하다" },
      { en: "comprehensive", ko: "포괄적인(종합적인)" },
      { en: "discharge", ko: "방출(방전)(하다), 제대시키다, 퇴원시키다, 석방하다" },
      { en: "merge", ko: "합병하다(합치다)" },
      { en: "emerge", ko: "나타나다(나오다)" },
      { en: "submerge", ko: "잠기다(가라앉히다)" },
      { en: "emergence", ko: "출현(발생)" },
      { en: "emergency", ko: "비상(사태)" },
      { en: "barrier", ko: "장벽(장애물)" },

      { en: "depict", ko: "묘사하다" },
      { en: "depiction", ko: "묘사" },
      { en: "deprive", ko: "박탈하다" },
      { en: "deprived", ko: "가난한" },
      { en: "deprivation", ko: "부족(박탈)" },
      { en: "conceal", ko: "숨기다" },
      { en: "indulge", ko: "탐닉하다(빠지다)" },
      { en: "indulgent", ko: "관대한(마음껏 하게 하는)" },
      { en: "indulgence", ko: "빠짐(탐닉함)" },
      { en: "recharge", ko: "재충전하다" },

      { en: "rechargeable", ko: "재충전할 수 있는" },
      { en: "magnitude", ko: "중요성(크기,거대함)" },
      { en: "dispense", ko: "분배하다, 없애다(없이 지내다)" },
      { en: "concerning", ko: "에 관하여" },
      { en: "coward", ko: "겁쟁이" },
      { en: "cowardice", ko: "비겁함(겁 많음)" },
      { en: "cowardly", ko: "비겁한(겁 많은)" },
      { en: "vigor", ko: "활기(원기)" },
      { en: "vigorous", ko: "활기찬" },
      { en: "feeble", ko: "연약한(허약한)" },

      { en: "colony", ko: "식민지" },
      { en: "colonize", ko: "식민지로 개척하다" },
      { en: "colonial", ko: "식민지의" },
      { en: "keen", ko: "열망하는, 예리한" },
      { en: "masculine", ko: "남성적인" },
      { en: "feminine", ko: "여성적인" },
      { en: "skeptical", ko: "회의적인(의심 많은)" },
      { en: "skepticism", ko: "의심(회의)" },
      { en: "yield", ko: "생산하다(수확량), 굴복하다, 양보하다" },
      { en: "confidential", ko: "비밀의" },

      { en: "dignity", ko: "품위(존엄성)" },
      { en: "dignify", ko: "품위 있어 보이게 하다" },
      { en: "aircraft", ko: "항공기" },
      { en: "pave", ko: "포장하다(닦다)" },
      { en: "pavement", ko: "포장도로(보도)" },
      { en: "renovate", ko: "수리하다(새롭게 하다)" },
      { en: "renovation", ko: "수리(새롭게 함=혁신)" },
      { en: "aesthetic", ko: "미적인" },
      { en: "aesthetics", ko: "미학" },
      { en: "modest", ko: "보통의(적당한), 겸손한" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
