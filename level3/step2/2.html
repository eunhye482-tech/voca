<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "dwell", ko: "거주하다, 살다, 곰곰이 생각하다" },
      { en: "repel", ko: "물리치다, 쫓아버리다" },
      { en: "pulse", ko: "맥박" },
      { en: "impulse", ko: "충동, 자극" },
      { en: "impulsive", ko: "충동적인" },
      { en: "bachelor", ko: "독신남, 미혼남, 학사" },
      { en: "improper", ko: "부적절한" },
      { en: "impure", ko: "더러운" },
      { en: "pledge", ko: "약속[맹세](하다)" },
      { en: "modify", ko: "수정하다" },

      { en: "illusion", ko: "환상, 착각" },
      { en: "disguise", ko: "변장하다" },
      { en: "contract", ko: "계약(서), 수축시키다, 걸리다" },
      { en: "contraction", ko: "수축" },
      { en: "contractor", ko: "계약자" },
      { en: "ingredient", ko: "재료, 성분, 구성요소" },
      { en: "subtract", ko: "빼다" },
      { en: "abstract", ko: "추상적인, 요약[발췌](하다)" },
      { en: "concrete", ko: "구체적인" },
      { en: "incomplete", ko: "불완전한, 미완성의" },

      { en: "agenda", ko: "안건, 의제" },
      { en: "assent", ko: "동의하다" },
      { en: "dissent", ko: "반대하다" },
      { en: "decent", ko: "괜찮은, 질 좋은, 예의 바른" },
      { en: "oblige", ko: "강요하다" },
      { en: "seemingly", ko: "겉보기에는" },
      { en: "nominate", ko: "지명[임명]하다" },
      { en: "nomination", ko: "임명[지명]" },
      { en: "applaud", ko: "박수를 보내다" },
      { en: "applause", ko: "박수갈채" },

      { en: "automated", ko: "자동화된" },
      { en: "automation", ko: "자동화" },
      { en: "vacuum", ko: "진공(청소기로 청소하다)" },
      { en: "vacant", ko: "공석인[비어있는]" },
      { en: "evacuate", ko: "대피시키다" },
      { en: "impose", ko: "강요하다, 부과하다" },
      { en: "insane", ko: "제정신이 아닌, 미친" },
      { en: "indivisible", ko: "분리할 수 없는" },
      { en: "acoustic", ko: "청각의, 음향의" },
      { en: "extract", ko: "추출하다, 발췌(하다)" },

      { en: "obligatory", ko: "의무적인, 필수적인" },
      { en: "obligation", ko: "의무" },
      { en: "incentive", ko: "장려금, 우대책, 동기" },
      { en: "coexist", ko: "공존하다" },
      { en: "lord", ko: "지배자, 군주, 영주, 귀족, 하나님" },
      { en: "landlord", ko: "(집)주인" },
      { en: "evaluation", ko: "평가" },
      { en: "inspiration", ko: "영감, 아이디어, 격려" },
      { en: "winding", ko: "구불구불한" },
      { en: "patron", ko: "후원자, (단골)손님" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
