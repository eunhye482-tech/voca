<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "inflate", ko: "부풀리다(물가를 올리다)" },
      { en: "addictive", ko: "중독성이 있는" },
      { en: "address", ko: "연설하다, 다루다(처리하다)" },
      { en: "realism", ko: "사실(현실)주의" },
      { en: "realistic", ko: "현실적인" },
      { en: "reality", ko: "현실" },
      { en: "script", ko: "대본(원고), 문자(글씨)" },
      { en: "afflicted", ko: "괴로워하는(고통 받는)" },
      { en: "affliction", ko: "고통" },
      { en: "optimal", ko: "최선의(최적의)" },

      { en: "optical", ko: "시각적인" },
      { en: "preoccupy", ko: "사로잡다" },
      { en: "preoccupied", ko: "사로잡힌" },
      { en: "preoccupation", ko: "사로잡힘(몰두)" },
      { en: "revolve", ko: "돌다" },
      { en: "unbeatable", ko: "패배시킬 수 없는" },
      { en: "triumphant", ko: "크게 성공한" },
      { en: "cite", ko: "인용하다" },
      { en: "issue", ko: "쟁점(문제), 발급(발행)하다, 발행물, 발표하다" },
      { en: "evolve", ko: "진화(발전)하다" },

      { en: "evolution", ko: "진화(발전)" },
      { en: "ego", ko: "자아(자만,자존심)" },
      { en: "egocentric", ko: "자기중심적인" },
      { en: "egoism", ko: "이기주의" },
      { en: "stuffed", ko: "박제된" },
      { en: "striped", ko: "줄무늬가 있는" },
      { en: "lessen", ko: "줄이다, 줄다" },
      { en: "immense", ko: "엄청난" },
      { en: "immerse", ko: "담그다, 몰두시키다" },
      { en: "session", ko: "시간(기간), 수업(시간), 회의" },

      { en: "linguistic", ko: "언어(학)의, 어학의" },
      { en: "linguist", ko: "언어학자(언어에 능통한 사람)" },
      { en: "linguistics", ko: "언어학" },
      { en: "diminish", ko: "줄이다" },
      { en: "amend", ko: "고치다(수정하다)" },
      { en: "antipathy", ko: "반감" },
      { en: "rehearsal", ko: "예행연습" },
      { en: "fuse", ko: "결합(융합)되다" },
      { en: "glare", ko: "눈부신 빛, 노려보다" },
      { en: "closet", ko: "옷장(벽장)" },

      { en: "sophomore", ko: "학년" },
      { en: "aspire", ko: "열망하다" },
      { en: "aspiration", ko: "포부(열망)" },
      { en: "perspire", ko: "땀을 흘리다" },
      { en: "perspiration", ko: "땀(노력)" },
      { en: "expire", ko: "만료되다(죽다)" },
      { en: "abandon", ko: "버리다(포기하다)" },
      { en: "banish", ko: "추방하다" },
      { en: "vanish", ko: "사라지다" },
      { en: "capacity", ko: "능력, 용량(수용능력)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
