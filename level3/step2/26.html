<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "modesty", ko: "겸손" },
      { en: "conform", ko: "따르다(순응하다)" },
      { en: "runway", ko: "활주로" },
      { en: "confrontation", ko: "대결(대립)" },
      { en: "grant", ko: "허락(승인)(하다), 보조금" },
      { en: "notorious", ko: "악명 높은" },
      { en: "exert", ko: "행사(발휘)하다" },
      { en: "marble", ko: "대리석" },
      { en: "counterattack", ko: "반격(하다)" },
      { en: "counterpart", ko: "상대" },

      { en: "controversy", ko: "논란(논쟁)" },
      { en: "controversial", ko: "논란이 많은" },
      { en: "intervene", ko: "중재하다, 가로막다" },
      { en: "intervention", ko: "개입(간섭)" },
      { en: "inscribe", ko: "새기다" },
      { en: "subscribe", ko: "서명하다, 구독하다, 기부하다" },
      { en: "subscription", ko: "구독(료), 기부금, 서명" },
      { en: "conscience", ko: "양심" },
      { en: "inevitable", ko: "불가피한" },
      { en: "curse", ko: "저주(하다), 욕(하다)" },

      { en: "curb", ko: "억제(하다)" },
      { en: "carve", ko: "조각하다" },
      { en: "crave", ko: "갈망하다" },
      { en: "craving", ko: "갈망(열망)" },
      { en: "ultimate", ko: "궁극적인(최종의), 최고의" },
      { en: "paradigm", ko: "대표적 사례(인식 체계)" },
      { en: "armor", ko: "갑옷" },
      { en: "penetrate", ko: "관통(침투)하다" },
      { en: "roam", ko: "배회하다, 돌아 다니다" },
      { en: "roar", ko: "으르렁 거리다(고함치다)" },

      { en: "vibration", ko: "진동(떨림)" },
      { en: "vibrate", ko: "진동하다(떨리다)" },
      { en: "vibrant", ko: "활기찬(진동하는)" },
      { en: "weird", ko: "이상한" },
      { en: "slam", ko: "콰당 닫다" },
      { en: "surrender", ko: "항복(하다), 양도(하다)" },
      { en: "surmount", ko: "극복하다" },
      { en: "insurmountable", ko: "극복할 수 없는" },
      { en: "render", ko: "~로 만들다, 제공하다" },
      { en: "lawsuit", ko: "소송" },

      { en: "consistency", ko: "일관성" },
      { en: "penalty", ko: "처벌(벌금,불이익)" },
      { en: "penalize", ko: "처벌하다" },
      { en: "joint", ko: "공동의(합동의), 관절(접합부분)" },
      { en: "allocate", ko: "할당(배분)하다" },
      { en: "allocation", ko: "할당(배분)" },
      { en: "reproduce", ko: "복사(복제,재생)하다, 번식하다" },
      { en: "reproduction", ko: "번식, 복제(품)" },
      { en: "convince", ko: "설득하다(확신시키다)" },
      { en: "convicted", ko: "유죄 선고를 받은" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
