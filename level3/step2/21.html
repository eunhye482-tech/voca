<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "synthesize", ko: "합성(종합)하다" },
      { en: "synthesis", ko: "종합(합성)" },
      { en: "duration", ko: "지속(되는 시간)" },
      { en: "durable", ko: "내구성이 좋은(오래가는)" },
      { en: "sustainability", ko: "지속 가능성" },
      { en: "unattainable", ko: "도달(획득)불가능한" },
      { en: "unequal", ko: "불공평한(같지 않은)" },
      { en: "unfairly", ko: "부당하게" },
      { en: "ally", ko: "동맹국, 동맹하다" },
      { en: "alliance", ko: "동맹(협력)" },

      { en: "alley", ko: "골목(좁은 길)" },
      { en: "array", ko: "배열" },
      { en: "rally", ko: "집회(결집하다)" },
      { en: "archaeology", ko: "고고학" },
      { en: "archaeological", ko: "고고학의(고고학적인)" },
      { en: "archaeologist", ko: "고고학자" },
      { en: "anthropology", ko: "인류학" },
      { en: "anthropological", ko: "인류학적인" },
      { en: "anthropologist", ko: "인류학자" },
      { en: "theology", ko: "신학" },

      { en: "physiology", ko: "생리(학)" },
      { en: "candid", ko: "솔직한" },
      { en: "typical", ko: "전형(대표,일반)적인" },
      { en: "outline", ko: "개요(윤곽)를 말하다" },
      { en: "outbreak", ko: "발생" },
      { en: "inject", ko: "주사(주입)하다" },
      { en: "project", ko: "과제(사업,계획), 투사하다, 예측(추정)하다" },
      { en: "projection", ko: "추정, 투사(영사)" },
      { en: "eject", ko: "쫓아내다(방출하다)" },
      { en: "bullet", ko: "총알" },

      { en: "visible", ko: "눈에 보이는(명백한)" },
      { en: "restrain", ko: "억제하다" },
      { en: "restraint", ko: "제약" },
      { en: "restrained", ko: "절제된(제약된,차분한)" },
      { en: "propel", ko: "추진하다(나아가게 하다)" },
      { en: "expel", ko: "내쫓다" },
      { en: "compel", ko: "강요하다" },
      { en: "compelling", ko: "설득력 있는(강력한)" },
      { en: "compulsory", ko: "의무(필수,강제)적인" },
      { en: "spontaneous", ko: "자발적인(자연스러운)" },

      { en: "odor", ko: "냄새" },
      { en: "swear", ko: "맹세하다, 욕하다" },
      { en: "molecule", ko: "분자" },
      { en: "atom", ko: "원자" },
      { en: "atomic", ko: "원자(력)의" },
      { en: "exclaim", ko: "외치다(소리치다)" },
      { en: "proclaim", ko: "선언하다" },
      { en: "undergraduate", ko: "대학생(대학 재학생)" },
      { en: "figure", ko: "인물(모습,몸매,도표), 숫자(수치), 계산(이해)하다" },
      { en: "organ", ko: "장기(기관)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
