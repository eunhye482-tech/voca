<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "lyrical", ko: "서정적인" },
      { en: "dormant", ko: "휴면기의, 잠자는" },
      { en: "output", ko: "생산(량)" },
      { en: "forecast", ko: "예보(하다)[예측(하다)]" },
      { en: "foremost", ko: "최고의, 으뜸의" },
      { en: "foreshadow", ko: "전조가 되다, 징조를 보이다" },
      { en: "zealous", ko: "열정적인" },
      { en: "erode", ko: "침식[약화]시키다" },
      { en: "erosion", ko: "침식, 약화" },
      { en: "constraint", ko: "제약, 제한" },

      { en: "prominent", ko: "두드러진, 돌출된, 저명한" },
      { en: "prolong", ko: "연장하다, 늘리다" },
      { en: "prolonged", ko: "오래 지속되는, 장기적인" },
      { en: "provoke", ko: "자극하다, 화나게 하다" },
      { en: "durability", ko: "내구성, 튼튼함" },
      { en: "heredity", ko: "유전" },
      { en: "hereditary", ko: "유전적인" },
      { en: "privilege", ko: "특권, 특혜" },
      { en: "acquaintance", ko: "알고 있음, 아는 사람" },
      { en: "materialism", ko: "물질만능주의, 유물론" },

      { en: "subordinate", ko: "종속하는, 부차적인, 하위의, 부하" },
      { en: "coordinate", ko: "조(직)화시키다, 조정하다" },
      { en: "coordination", ko: "조직화, 조정" },
      { en: "corporation", ko: "기업" },
      { en: "corporate", ko: "기업의" },
      { en: "incorporate", ko: "포함하다, 통합시키다" },
      { en: "merchandise", ko: "상품" },
      { en: "lure", ko: "유혹(하다), 미끼" },
      { en: "overview", ko: "개요, 개관" },
      { en: "slender", ko: "날씬한" },

      { en: "mimic", ko: "흉내내다, 모방하다" },
      { en: "execute", ko: "실행[수행]하다, 처형하다" },
      { en: "executive", ko: "중역, 경영 간부, 임원" },
      { en: "nuclear", ko: "핵의, 원자력의" },
      { en: "outset", ko: "시작, 착수" },
      { en: "hemisphere", ko: "반구" },
      { en: "mythology", ko: "신화" },
      { en: "mythological", ko: "신화적인" },
      { en: "compost", ko: "퇴비" },
      { en: "clarify", ko: "명확하게 하다, 명료함" },

      { en: "botany", ko: "식물학" },
      { en: "migrate", ko: "이동하다" },
      { en: "emigrate", ko: "이민[이주해]가다" },
      { en: "immigrate", ko: "이민[이주해]오다" },
      { en: "migration", ko: "이동, 이주" },
      { en: "migrant", ko: "이주민" },
      { en: "outweigh", ko: "(보다) 더 크다[중요하다, 무겁다]" },
      { en: "emigrant", ko: "이민[이주해]가는 사람" },
      { en: "immigrant", ko: "이민[이주해]오는 사람" },
      { en: "flesh", ko: "과육, 살, 살코기" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
