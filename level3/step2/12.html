<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "dissuade", ko: "단념 시키다" },
      { en: "frontier", ko: "국경(지역), 경계, 한계" },
      { en: "browse", ko: "훑어보다, 둘러보다" },
      { en: "vapor", ko: "증기" },
      { en: "evaporate", ko: "증발시키다, 증발하다" },
      { en: "discern", ko: "분별하다, 인식하다" },
      { en: "coincide", ko: "일치하다, 동시에 발생하다" },
      { en: "coincidence", ko: "우연의 일치, 동시 발생" },
      { en: "gigantic", ko: "거대한" },
      { en: "landmark", ko: "주요 건물, 지형지물, 획기적인 사건" },

      { en: "circuit", ko: "순환, (전기)회로" },
      { en: "swell", ko: "붓다, 부풀다, 증가하다, 팽창하다" },
      { en: "bruise", ko: "멍, 타박상" },
      { en: "ape", ko: "유인원, 원숭이" },
      { en: "injurious", ko: "해로운" },
      { en: "dismay", ko: "당황(하게하다), 실망(시키다)" },
      { en: "choir", ko: "합창단, 합창하다" },
      { en: "legacy", ko: "유산" },
      { en: "tame", ko: "길들이다, 길들여진" },
      { en: "troublesome", ko: "성가신, 고질적인" },

      { en: "attribute", ko: "~ 덕분[탓]으로 돌리다, 속성, 특성" },
      { en: "contribute", ko: "기부하다, 기여하다, 기고하다" },
      { en: "distribute", ko: "분배하다" },
      { en: "vividly", ko: "생생하게" },
      { en: "graphic", ko: "생생한, 그림의" },
      { en: "particle", ko: "입자, 작은 조각" },
      { en: "undermine", ko: "약화시키다" },
      { en: "adolescence", ko: "사춘기, 청소년기" },
      { en: "adolescent", ko: "청소년(의)" },
      { en: "ratio", ko: "비율" },

      { en: "rotation", ko: "자전, 회전, 교대" },
      { en: "rotate", ko: "회전하다, 교대근무하다" },
      { en: "moist", ko: "축축한, 습기가 있는" },
      { en: "moisture", ko: "습기, 수분" },
      { en: "metabolism", ko: "신진[물질]대사" },
      { en: "verbal", ko: "언어의, 말로 하는" },
      { en: "nonverbal", ko: "비언어적인" },
      { en: "visualize", ko: "상상하다, 시각화 하다" },
      { en: "vast", ko: "엄청난" },
      { en: "soothe", ko: "가라앉히다, 완화하다" },

      { en: "prevalence", ko: "유행" },
      { en: "prevalent", ko: "널리 퍼진, 유행하는" },
      { en: "overthrow", ko: "뒤엎다, 전복(시키다)" },
      { en: "faculty", ko: "능력, 재능, 교수진" },
      { en: "tribe", ko: "부족" },
      { en: "legitimate", ko: "정당한, 합법적인" },
      { en: "orchard", ko: "과수원" },
      { en: "march", ko: "행진(하다)" },
      { en: "strive", ko: "노력하다" },
      { en: "halt", ko: "멈추다, 멈춤" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
