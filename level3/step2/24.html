<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "combat", ko: "싸우다(전투)" },
      { en: "reproach", ko: "비난(하다)" },
      { en: "commercial", ko: "상업적인, 광고(방송)" },
      { en: "odd", ko: "이상한, 홀수의" },
      { en: "even", ko: "고른(평평한,균등한), 짝수의" },
      { en: "mandate", ko: "명령,위임(하다)" },
      { en: "mandatory", ko: "의무(강제적인)" },
      { en: "bias", ko: "편견" },
      { en: "biased", ko: "편견을 가진(편향된)" },
      { en: "unbiased", ko: "편견이 없는" },

      { en: "fallacy", ko: "오류" },
      { en: "animate", ko: "생기(생명)를 불어넣다" },
      { en: "unanimous", ko: "만장일치의" },
      { en: "anonymous", ko: "익명의" },
      { en: "synonym", ko: "동의어" },
      { en: "antonym", ko: "반의어" },
      { en: "commodity", ko: "상품" },
      { en: "sweep", ko: "휩쓸다, 청소하다" },
      { en: "sweeping", ko: "전면적인(광범위한)" },
      { en: "tuition", ko: "수업(료)" },

      { en: "intuition", ko: "직감(직관)" },
      { en: "intuitive", ko: "직관적인" },
      { en: "captive", ko: "사로잡힌, 포로(의)" },
      { en: "captivity", ko: "감금상태" },
      { en: "captivate", ko: "마음을 사로잡다" },
      { en: "company", ko: "친구, 함께 있음" },
      { en: "biodiversity", ko: "생물다양성" },
      { en: "biotechnology", ko: "생명공학" },
      { en: "antibiotic", ko: "항생제(항생물질)" },
      { en: "biochemistry", ko: "생화학" },

      { en: "biofuel", ko: "생물연료" },
      { en: "quest", ko: "탐구(탐색,추구)" },
      { en: "simulate", ko: "척하다(흉내내다), 모의실험하다" },
      { en: "simultaneous", ko: "동시에 일어난(동시의)" },
      { en: "simultaneously", ko: "동시에" },
      { en: "accumulate", ko: "축적하다(모으다)" },
      { en: "compassion", ko: "동정심(연민)" },
      { en: "contempt", ko: "모욕(경멸)" },
      { en: "contemplate", ko: "심사숙고(명상)하다" },
      { en: "cease", ko: "중지하다(그만두다)" },

      { en: "lease", ko: "임대차" },
      { en: "tease", ko: "놀리다(괴롭히다)" },
      { en: "unceasing", ko: "끊임없는(부단한)" },
      { en: "charge", ko: "충전하다, 요금(을 청구하다), 책임, 기소(고소,비난)하다, 공격(돌격)(하다)" },
      { en: "complaint", ko: "불평" },
      { en: "heir", ko: "상속인(계승자)" },
      { en: "heritage", ko: "유산(전통)" },
      { en: "inherit", ko: "물려받다" },
      { en: "confess", ko: "자백(고백)하다" },
      { en: "esteem", ko: "존경(하다)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
