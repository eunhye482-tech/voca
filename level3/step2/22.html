<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "organic", ko: "유기농의" },
      { en: "organism", ko: "유기체(생물,생명체)" },
      { en: "organize", ko: "조직(준비,정리)하다" },
      { en: "organization", ko: "조직(단체,기구)" },
      { en: "violate", ko: "침해(위반)하다" },
      { en: "finite", ko: "한정된(유한한)" },
      { en: "infinite", ko: "무한한" },
      { en: "confine", ko: "제한하다, 가두다, 감금하다" },
      { en: "refine", ko: "개선하다(세련되게하다), 순화(정제)하다" },
      { en: "surpass", ko: "앞서다(능가하다)" },

      { en: "supreme", ko: "최고의" },
      { en: "flat", ko: "평평한(평지인), 단조로운(균일한), 펑크난" },
      { en: "flatter", ko: "아첨하다" },
      { en: "commit", ko: "저지르다, 약속하다, 전념(헌신)하다" },
      { en: "commitment", ko: "약속, 헌신(전념)" },
      { en: "omit", ko: "생략하다(빠트리다)" },
      { en: "emit", ko: "방출하다(내뿜다)" },
      { en: "summit", ko: "정상" },
      { en: "emission", ko: "배출(방출)" },
      { en: "dismiss", ko: "해고하다(내쫓다), 무시(묵살)하다" },

      { en: "dismissal", ko: "해고(무시)" },
      { en: "transaction", ko: "거래(처리)" },
      { en: "transmit", ko: "전달하다, 전염시키다" },
      { en: "vomit", ko: "토하다" },
      { en: "transplant", ko: "이식(하다)" },
      { en: "transparent", ko: "투명한, 솔직한(알기쉬운)" },
      { en: "transition", ko: "과도기(변천)" },
      { en: "transcend", ko: "초월하다(넘다)" },
      { en: "transfusion", ko: "수혈" },
      { en: "transcribe", ko: "베끼다(옮겨쓰다,기록하다)" },

      { en: "ascribe", ko: "탓으로 돌리다" },
      { en: "souvenir", ko: "기념품" },
      { en: "alternative", ko: "대체가능한(다른), 대안" },
      { en: "eminent", ko: "저명한(탁월한)" },
      { en: "imminent", ko: "임박한" },
      { en: "unstable", ko: "불안정한" },
      { en: "parental", ko: "부모의" },
      { en: "maternal", ko: "모성의(어머니의)" },
      { en: "paternal", ko: "아버지의(부성의)" },
      { en: "myth", ko: "신화, 근거 없는 믿음" },

      { en: "mythical", ko: "상상 속의(신화적인)" },
      { en: "suspend", ko: "매달다, 연기하다(보류하다), 정학(정직)시키다" },
      { en: "impending", ko: "임박한(절박한)" },
      { en: "pendulum", ko: "추" },
      { en: "append", ko: "첨부하다(덧붙이다)" },
      { en: "insight", ko: "통찰력" },
      { en: "insightful", ko: "통찰력 있는" },
      { en: "aggressive", ko: "공격(적극)적인" },
      { en: "aggression", ko: "공격(성)" },
      { en: "inflation", ko: "물가상승(팽창)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
