<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "dispel", ko: "없애다, 떨쳐버리다" },
      { en: "convention", ko: "회의, 집회, 관습, 전통" },
      { en: "conventional", ko: "전통적인, 판에 박힌" },
      { en: "rude", ko: "무례한" },
      { en: "receptive", ko: "수용적인, 잘 받아들이는" },
      { en: "intonation", ko: "억양" },
      { en: "paradox", ko: "역설, 모순" },
      { en: "paradoxical", ko: "모순된, 역설적인" },
      { en: "troop", ko: "군대, 병력, 무리, 떼" },
      { en: "appreciation", ko: "감사, 감상" },

      { en: "depreciation", ko: "가치하락" },
      { en: "sequence", ko: "순서, 연속" },
      { en: "subsequent", ko: "다음의, 그 후의" },
      { en: "consequence", ko: "결과, 중요성" },
      { en: "consequent", ko: "결과로 일어나는" },
      { en: "consequently", ko: "결과적으로" },
      { en: "ambush", ko: "매복(하여 기습하다)" },
      { en: "federal", ko: "연방제의, 연방 정부의, 연합의" },
      { en: "intensive", ko: "집중적인, 강렬한" },
      { en: "commission", ko: "위원회, 수수료" },

      { en: "sin", ko: "죄" },
      { en: "infrastructure", ko: "사회기반시설" },
      { en: "hatred", ko: "증오(심)" },
      { en: "flush", ko: "물을 왈칵 내리다, 얼굴이 붉어지다, 홍조" },
      { en: "quarrel", ko: "(말)다툼, 다투다" },
      { en: "sheer", ko: "순수한, 완전한, 얇은, 가파른" },
      { en: "herd", ko: "떼, 무리" },
      { en: "herb", ko: "풀, 약초" },
      { en: "arbitrary", ko: "제멋대로의, 임의의" },
      { en: "absurd", ko: "터무니없는, 불합리한" },

      { en: "bond", ko: "유대감(을 형성하다), 채권" },
      { en: "immune", ko: "면역의, 면역성 있는, 면제되는" },
      { en: "immunity", ko: "면역력" },
      { en: "apology", ko: "사과" },
      { en: "apologize", ko: "사과하다" },
      { en: "neutral", ko: "중립적인" },
      { en: "liberal", ko: "자유로운" },
      { en: "liberalize", ko: "자유화하다" },
      { en: "embark", ko: "(배에)승선하다, 시작하다" },
      { en: "liable", ko: "(법적)책임이 있는" },

      { en: "liability", ko: "법적 책임" },
      { en: "sterile", ko: "척박한, 불임의[새끼를 못 낳는], 살균한" },
      { en: "sterilize", ko: "소독[살균]하다" },
      { en: "norm", ko: "기준, 표준, 규범" },
      { en: "enormous", ko: "엄청난" },
      { en: "surplus", ko: "과잉(의), 혹시" },
      { en: "nutrient", ko: "영양소" },
      { en: "numb", ko: "마비된, 감각이 없는" },
      { en: "deficient", ko: "부족한" },
      { en: "deficit", ko: "적자, 부족(액)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
