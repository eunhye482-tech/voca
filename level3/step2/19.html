<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "pottery", ko: "도자기" },
      { en: "bar", ko: "술집, 장애(물), 막다, 금지하다" },
      { en: "score", ko: "득점하다" },
      { en: "censure", ko: "비난(하다)" },
      { en: "sanitation", ko: "위생(시설)" },
      { en: "resume", ko: "재개하다, 다시 시작하다, 이력서" },
      { en: "dosage", ko: "(약의) 복용량" },
      { en: "remodel", ko: "개조하다" },
      { en: "assault", ko: "폭행[습격](을 가하다)" },
      { en: "precede", ko: "선행하다, 앞서다" },

      { en: "precedent", ko: "전례, 선례" },
      { en: "unprecedented", ko: "전례 없는" },
      { en: "preceding", ko: "이전의, 앞선" },
      { en: "predecessor", ko: "전임자, 이전의 것" },
      { en: "recede", ko: "물러나다, 멀어지다" },
      { en: "cargo", ko: "화물" },
      { en: "tip", ko: "기울이다, 비법, 조언, 끝" },
      { en: "fort", ko: "요새" },
      { en: "fortify", ko: "요새화하다, 강화하다" },
      { en: "regress", ko: "퇴보(하다)" },

      { en: "congress", ko: "의회, 국회, 회의" },
      { en: "humble", ko: "겸손한, 초라한, 미천한" },
      { en: "original", ko: "원래의, 독창적인" },
      { en: "origin", ko: "기원, 유래, 출신, 혈통" },
      { en: "originality", ko: "독창성" },
      { en: "originate", ko: "유래(기원)하다" },
      { en: "aborigine", ko: "(호주) 원주민" },
      { en: "assign", ko: "배당(배정)하다" },
      { en: "assignment", ko: "과제" },
      { en: "resign", ko: "사직하다, 포기하다" },

      { en: "designate", ko: "지정(임명)하다" },
      { en: "potent", ko: "강력한, 효능있는" },
      { en: "soaring", ko: "치솟는" },
      { en: "sincere", ko: "진심 어린" },
      { en: "passage", ko: "경과, 흐름, 구절, 단락, 통로" },
      { en: "prohibit", ko: "금지하다, 방해하다" },
      { en: "prohibition", ko: "금지" },
      { en: "civilized", ko: "문명화된" },
      { en: "civilization", ko: "문명" },
      { en: "bound", ko: "향하는, 행의, 묶인, 의무가 있는" },

      { en: "abound", ko: "풍부하다" },
      { en: "fragile", ko: "깨지기 쉬운, 연약한" },
      { en: "fragment", ko: "파편, 조각" },
      { en: "cater", ko: "음식을 제공하다" },
      { en: "pillar", ko: "기둥" },
      { en: "caterpillar", ko: "애벌레" },
      { en: "geography", ko: "지리(학)" },
      { en: "geometry", ko: "기하학(적 구조)" },
      { en: "geology", ko: "지질학" },
      { en: "diameter", ko: "직경, 지름" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
