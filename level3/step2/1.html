<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "harsh", ko: "가혹한, 거친" },
      { en: "hardness", ko: "단단함, 고됨" },
      { en: "harness", ko: "이용하다" },
      { en: "glance", ko: "흘끗 봄, 흘끗보다" },
      { en: "hollow", ko: "속이 빈, 공허한" },
      { en: "oval", ko: "타원형(의)" },
      { en: "clan", ko: "씨족, 집단" },
      { en: "phenomenon", ko: "현상" },
      { en: "profit", ko: "이익" },
      { en: "profitable", ko: "이익이 되는" },

      { en: "nonprofit", ko: "비영리의" },
      { en: "hasty", ko: "성급한" },
      { en: "steep", ko: "가파른" },
      { en: "steer", ko: "조종하다, 안내하다" },
      { en: "summon", ko: "소집[소환, 호출]하다" },
      { en: "sermon", ko: "설교" },
      { en: "sculpt", ko: "조각하다" },
      { en: "crossroads", ko: "갈림길, 교차로" },
      { en: "crosswalk", ko: "횡단보도" },
      { en: "flaw", ko: "결함" },

      { en: "flawless", ko: "결함없는" },
      { en: "sibling", ko: "형제 자매" },
      { en: "recommendation", ko: "추천(서)" },
      { en: "secondary", ko: "부차적인, 중등 교육의" },
      { en: "secondhand", ko: "중고의, 간접적인" },
      { en: "hazard", ko: "위험(요소)" },
      { en: "stabilize", ko: "안정시키다" },
      { en: "hydrogen", ko: "수소" },
      { en: "whisper", ko: "속삭임, 속삭이다" },
      { en: "itinerary", ko: "여행 일정(표)" },

      { en: "sole", ko: "유일한, 혼자의" },
      { en: "solemn", ko: "엄숙한" },
      { en: "apprehend", ko: "이해하다, 체포하다" },
      { en: "apprehension", ko: "걱정, 불안" },
      { en: "immature", ko: "미성숙한" },
      { en: "decode", ko: "해독[이해]하다" },
      { en: "endeavor", ko: "노력(하다)" },
      { en: "appraise", ko: "평가하다" },
      { en: "appraisal", ko: "평가" },
      { en: "celebrity", ko: "유명 인사, 명성" },

      { en: "exaggerate", ko: "과장하다" },
      { en: "eliminate", ko: "없애다, 제거하다" },
      { en: "ingenious", ko: "독창적인, 영리한" },
      { en: "ingenuity", ko: "창의력, 솜씨" },
      { en: "ingenuous", ko: "솔직한, 순진한" },
      { en: "generate", ko: "발생시키다" },
      { en: "degenerate", ko: "타락한, 악화된다" },
      { en: "rash", ko: "성급한, 경솔한" },
      { en: "immeasurable", ko: "엄청난, 측정할 수 없는" },
      { en: "vegetation", ko: "식물, 초목" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
