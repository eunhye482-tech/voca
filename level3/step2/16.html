<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "informative", ko: "유익한" },
      { en: "informed", ko: "잘 아는" },
      { en: "gloomy", ko: "우울한" },
      { en: "burrow", ko: "굴(을 파다), 파고들다" },
      { en: "fade", ko: "희미해지다[빛 바래지다]" },
      { en: "impoverish", ko: "가난[황폐]하게 하다" },
      { en: "impoverished", ko: "가난한, 빈곤한" },
      { en: "bid", ko: "값을 부르다, 입찰하다" },
      { en: "exposition", ko: "박람회" },
      { en: "subjective", ko: "주관적인" },

      { en: "objective", ko: "객관적인" },
      { en: "ideal", ko: "이상(적인)" },
      { en: "idealize", ko: "이상화하다" },
      { en: "idealism", ko: "이상주의" },
      { en: "utilize", ko: "활용하다" },
      { en: "utility", ko: "유용성, 설비, 공익사업" },
      { en: "subconscious", ko: "잠재(의식)적인" },
      { en: "bait", ko: "미끼" },
      { en: "elastic", ko: "탄력[신축성]있는" },
      { en: "barter", ko: "물물교환" },

      { en: "condense", ko: "농축하다, 요약하다" },
      { en: "mill", ko: "공장, 방앗간" },
      { en: "tread", ko: "걷다, 밟다" },
      { en: "treadmill", ko: "러닝머신" },
      { en: "reconcile", ko: "화해시키다" },
      { en: "reconciliation", ko: "화해" },
      { en: "cast", ko: "출연진, 배역(을 정하다), 던지다, 깁스" },
      { en: "hay", ko: "건초, 말린 풀" },
      { en: "utensil", ko: "도구, 기구" },
      { en: "socialization", ko: "사회화" },

      { en: "the Orient", ko: "동양" },
      { en: "orient", ko: "(지)향하게 하다" },
      { en: "oriented", ko: "지향적인" },
      { en: "orientation", ko: "성향, 지향" },
      { en: "stereotype", ko: "고정 관념" },
      { en: "naked eye", ko: "육안" },
      { en: "thrive", ko: "번창하다, 잘 자라다" },
      { en: "offspring", ko: "새끼, 자손" },
      { en: "nurture", ko: "양육하다" },
      { en: "shipping", ko: "선박, 배송, 운송, 선적, 해상운송, 해운" },

      { en: "log", ko: "통나무, 기록, 일지" },
      { en: "logging", ko: "벌목" },
      { en: "solid", ko: "확실한, 단단한, 고체의" },
      { en: "grasp", ko: "꽉 잡다, 이해(하다)" },
      { en: "prosecute", ko: "고발[고소]하다" },
      { en: "prosecution", ko: "기소, 고발, 검찰측" },
      { en: "prosecutor", ko: "검사" },
      { en: "elevate", ko: "높이다, 올리다, 승진시키다" },
      { en: "elevation", ko: "(해발)고도[상승, 승진]" },
      { en: "impel", ko: "강요하다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
