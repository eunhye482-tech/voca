<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "thermometer", ko: "온도계" },
      { en: "arrogant", ko: "거만한" },
      { en: "barometer", ko: "기압계, 척도, 지표, 기준" },
      { en: "symmetry", ko: "대칭, 균형" },
      { en: "asymmetry", ko: "비대칭성, 불균형" },
      { en: "attain", ko: "달성하다, 획득하다" },
      { en: "conceit", ko: "자만심" },
      { en: "intense", ko: "강렬한, 극심한" },
      { en: "intensify", ko: "강화시키다, 격렬하게 하다" },
      { en: "intensity", ko: "강도, 강렬함, 세기" },

      { en: "hospitality", ko: "환대, 친절" },
      { en: "hospitable", ko: "친절한, 환대하는" },
      { en: "hospitalize", ko: "입원시키다" },
      { en: "account", ko: "설명(하다), 차지하다, 계좌, 계정" },
      { en: "humid", ko: "습한" },
      { en: "humidity", ko: "습도, 습기" },
      { en: "proceed", ko: "계속 진행하다" },
      { en: "procedure", ko: "절차, 방법" },
      { en: "recess", ko: "휴식, 휴회" },
      { en: "recession", ko: "경기 불황, 불경기" },

      { en: "suicide", ko: "자살" },
      { en: "pesticide", ko: "농약, 살충제" },
      { en: "negotiate", ko: "협상하다" },
      { en: "install", ko: "설치하다" },
      { en: "defensive", ko: "방어적인, 공격적인, 불쾌한" },
      { en: "sector", ko: "부문(영역)" },
      { en: "monarch", ko: "군주, 제왕" },
      { en: "monarchy", ko: "군주제" },
      { en: "hierarchy", ko: "계층, 계급" },
      { en: "anarchy", ko: "혼란, 무정부 상태" },

      { en: "chop", ko: "(잘게) 썰다, 자르다" },
      { en: "preservative", ko: "방부제" },
      { en: "downright", ko: "명백한" },
      { en: "current", ko: "현재의, 해류, 전류, 기류, 경향" },
      { en: "currency", ko: "유통, 통용, 화폐" },
      { en: "monotonous", ko: "단조로운" },
      { en: "tune", ko: "조율(조정)하다, 곡(조)" },
      { en: "monopoly", ko: "독점(판매)" },
      { en: "monopolize", ko: "독점하다" },
      { en: "monolingual", ko: "하나의 언어를 사용하는" },

      { en: "inaudible", ko: "들리지 않는" },
      { en: "auditorium", ko: "강당" },
      { en: "understate", ko: "과소평가하다" },
      { en: "tone", ko: "어조, 분위기, 색조" },
      { en: "appreciate", ko: "감사하다, 감상하다, 인정(이해)하다" },
      { en: "depreciate", ko: "가치가 떨어지다" },
      { en: "unified", ko: "통일된(통합된)" },
      { en: "undertake", ko: "떠맡다(시작하다)" },
      { en: "erect", ko: "세우다(건설하다), 똑바로 선(수직의)" },
      { en: "synthetic", ko: "합성의(종합의), 인조의" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
