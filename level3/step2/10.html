<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "abuse", ko: "학대하다, 남용하다" },
      { en: "accomplished", ko: "이미 정해진, 완성된, 뛰어난" },
      { en: "alter", ko: "바꾸다" },
      { en: "velocity", ko: "속도" },
      { en: "outrun", ko: "넘어서다" },
      { en: "moan", ko: "신음(하다)" },
      { en: "affirm", ko: "단언[주장, 긍정]하다" },
      { en: "affirmation", ko: "긍정, 단언" },
      { en: "affirmative", ko: "긍정적인" },
      { en: "naive", ko: "순진한" },

      { en: "beverage", ko: "음료" },
      { en: "bunch", ko: "다발" },
      { en: "antique", ko: "오래된, 골동품" },
      { en: "nasty", ko: "비열한, 못된, 끔찍한, 불쾌한" },
      { en: "horn", ko: "경적, 뿔" },
      { en: "thorny", ko: "가시가 많은" },
      { en: "circulate", ko: "유포하다, 순환시키다" },
      { en: "circulation", ko: "순환" },
      { en: "circular", ko: "둥근, 순환하는" },
      { en: "galaxy", ko: "은하계" },

      { en: "outlaw", ko: "금지[불법화]하다" },
      { en: "ascend", ko: "오르다" },
      { en: "adhere", ko: "들러붙다, 고수하다" },
      { en: "adhesive", ko: "잘 들러붙는, 접착제" },
      { en: "prestige", ko: "명성, 위신" },
      { en: "prestigious", ko: "일류의, 명성있는" },
      { en: "plot", ko: "줄거리(를 만들다), 음모(를 꾸미다)" },
      { en: "agreeable", ko: "유쾌한" },
      { en: "disagreeable", ko: "불쾌한" },
      { en: "outdress", ko: "(보다) 옷을 더 잘 입다" },

      { en: "diabetes", ko: "당뇨병" },
      { en: "mammal", ko: "포유류" },
      { en: "underlie", ko: "기초가[근본이] 되다" },
      { en: "underlying", ko: "근본적인" },
      { en: "stem", ko: "줄기, 생기다, 유래하다" },
      { en: "aspect", ko: "측면, 양상, 모습" },
      { en: "suspicion", ko: "의심, 혐의" },
      { en: "suspicious", ko: "의심스러운" },
      { en: "asset", ko: "자산, 재산" },
      { en: "accommodate", ko: "숙박시키다, 적응하다" },

      { en: "accommodation", ko: "숙박시설, 숙소" },
      { en: "astonished", ko: "놀란" },
      { en: "stern", ko: "엄격한" },
      { en: "index", ko: "색인, 찾아보기, 지수, 지표" },
      { en: "avalanche", ko: "눈사태, 쇄도" },
      { en: "presume", ko: "추정하다" },
      { en: "presumption", ko: "추정" },
      { en: "presumably", ko: "아마도" },
      { en: "reside", ko: "거주하다, 살다" },
      { en: "residence", ko: "주거, 거주지" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
