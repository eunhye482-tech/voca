<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "unstable", ko: "불안정한" },
      { en: "slaughter", ko: "도살(하다), 대학살" },
      { en: "splendid", ko: "화려한, 멋진" },
      { en: "tenant", ko: "세입자, 임차인, 소작인" },
      { en: "groan", ko: "끙끙대다, 신음하다" },
      { en: "stroll", ko: "산책(하다)" },
      { en: "drip", ko: "방울(져 떨어지다)" },
      { en: "righteous", ko: "정당한, 합법적인" },
      { en: "domain", ko: "영역, 영토" },
      { en: "proportion", ko: "비율, 비례, 부분, 균형" },

      { en: "unrelated", ko: "관련이 없는" },
      { en: "obese", ko: "비만인" },
      { en: "obesity", ko: "비만" },
      { en: "vulnerable", ko: "취약한, 연약한" },
      { en: "hostage", ko: "인질" },
      { en: "errand", ko: "심부름, 잡일" },
      { en: "epidemic", ko: "전염병, 유행병" },
      { en: "outdated", ko: "구식인, 시대에 뒤진" },
      { en: "beforehand", ko: "미리, 사전에" },
      { en: "relay", ko: "전달하다, 중계하다" },

      { en: "alternate", ko: "번갈아 나오는, 교대하다" },
      { en: "landfill", ko: "쓰레기 매립지" },
      { en: "hatch", ko: "부화하다" },
      { en: "choke", ko: "질식(시키다)" },
      { en: "suppress", ko: "억제[억압]하다" },
      { en: "naked", ko: "벌거벗은" },
      { en: "impair", ko: "손상시키다" },
      { en: "impaired", ko: "손상된" },
      { en: "impairment", ko: "손상, 장애" },
      { en: "rent", ko: "빌리다, 빌려주다, 집세, 임대료, 임차료" },

      { en: "realm", ko: "왕국, 영역" },
      { en: "similarity", ko: "유사점" },
      { en: "curator", ko: "전시 책임자, 관리자" },
      { en: "symphony", ko: "교향곡" },
      { en: "superstitious", ko: "미신적인" },
      { en: "adjoin", ko: "인접하다, 붙어있다" },
      { en: "adjourn", ko: "연기하다, 휴회[중단]하다" },
      { en: "moderate", ko: "보통의, 적당한, 절제하는" },
      { en: "moderation", ko: "적당, 절제" },
      { en: "revolutionary", ko: "혁명적인, 혁명가" },

      { en: "outlive", ko: "(보다) 더 오래 살다" },
      { en: "virtual", ko: "가상의, 사실상의" },
      { en: "virtually", ko: "거의, 사실상" },
      { en: "superficial", ko: "표면[피상]적인" },
      { en: "gross", ko: "총(계의)[전체의]" },
      { en: "engrossed", ko: "몰두한" },
      { en: "contagion", ko: "감염, 전염" },
      { en: "contagious", ko: "전염성 있는" },
      { en: "disclose", ko: "밝히다, 폭로하다" },
      { en: "disclosure", ko: "노출, 폭로" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
