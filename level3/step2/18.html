<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "estimation", ko: "평가, 판단, 추정" },
      { en: "dock", ko: "부두, 선착장" },
      { en: "compound", ko: "합성물, 혼합하다" },
      { en: "liquid", ko: "액체(의)" },
      { en: "enclose", ko: "동봉하다, 둘러싸다" },
      { en: "chemical", ko: "화학적인, 화학의" },
      { en: "chemicals", ko: "화학물질" },
      { en: "chemistry", ko: "화학" },
      { en: "chemist", ko: "화학자" },
      { en: "drill", ko: "구멍을 뚫다, 시추하다, 훈련(시키다)" },

      { en: "ideological", ko: "이념적인" },
      { en: "vein", ko: "정맥" },
      { en: "artery", ko: "동맥" },
      { en: "plight", ko: "곤경, 어려운 처지" },
      { en: "boost", ko: "증진시키다, 후원(하다)" },
      { en: "stout", ko: "통통한, 뚱뚱한, 튼튼한" },
      { en: "ineffective", ko: "효과적이지 못한, 효과 없는" },
      { en: "undergo", ko: "경험하다, 받다" },
      { en: "unfamiliar", ko: "낯선" },
      { en: "cell", ko: "세포, 감방, 전지" },

      { en: "cellular", ko: "세포의" },
      { en: "craft", ko: "공예품, 기술, 비행기" },
      { en: "alleviate", ko: "완화시키다" },
      { en: "aggravate", ko: "악화시키다" },
      { en: "apparatus", ko: "(몸의)기관, 장치[기구]" },
      { en: "delegate", ko: "대표자, 위임하다" },
      { en: "defendant", ko: "피고" },
      { en: "attorney", ko: "변호사, 법률 대리인" },
      { en: "article", ko: "물건, 기사" },
      { en: "wreck", ko: "난파(선), 난파시키다, 망가뜨리다" },

      { en: "outlook", ko: "전망, 관점" },
      { en: "devastate", ko: "파괴하다" },
      { en: "devastating", ko: "파괴적인" },
      { en: "devastation", ko: "파괴" },
      { en: "outrage", ko: "분노, 격노" },
      { en: "stand", ko: "견디다, 참다, 가판대, 입장, 태도" },
      { en: "confederate", ko: "공모자, 공범, 동맹국, 동맹하다, 연합한" },
      { en: "claw", ko: "발톱" },
      { en: "endow", ko: "기부하다, 부여하다" },
      { en: "endowed", ko: "부여 받은, 타고난" },

      { en: "vessel", ko: "배, 그릇, 용기, 혈관" },
      { en: "compatible", ko: "양립[화합, 호환]할 수 있는" },
      { en: "incompatible", ko: "호환[양립]할 수 없는" },
      { en: "obsession", ko: "강박관념, 집착" },
      { en: "obsessed", ko: "집착하는, 사로잡힌" },
      { en: "usage", ko: "사용(량), 용법, 어법" },
      { en: "serve", ko: "도움이 되다, 복무[복역]하다" },
      { en: "rebel", ko: "반항하다, 반역자" },
      { en: "rebellion", ko: "반란, 반항" },
      { en: "rebellious", ko: "반항하는, 반역하는" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
