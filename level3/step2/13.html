<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "rainforest", ko: "(열대)우림" },
      { en: "squeeze", ko: "짜(내)다, 밀어[쑤셔]넣다" },
      { en: "sedentary", ko: "앉아서 지내는, 정착해 있는" },
      { en: "tow", ko: "견인(하다)" },
      { en: "probable", ko: "가능성 있는, 있을 것 같은" },
      { en: "probability", ko: "확률, 가능성" },
      { en: "stroke", ko: "타격, 뇌졸중, 쓰다듬다" },
      { en: "duplicate", ko: "복사하다, 중복하다, 중복의" },
      { en: "duplication", ko: "중복, 복사" },
      { en: "thrifty", ko: "검소한" },

      { en: "therapist", ko: "치료사" },
      { en: "statistics", ko: "통계학, 통계(자료)" },
      { en: "statistical", ko: "통계적인" },
      { en: "dump", ko: "내버리다" },
      { en: "glacier", ko: "빙하" },
      { en: "bribe", ko: "뇌물(을 주다)" },
      { en: "bribery", ko: "뇌물수수" },
      { en: "shelter", ko: "쉼터, 피신처, 보호소, 보호하다" },
      { en: "monument", ko: "기념비, 기념물" },
      { en: "monumental", ko: "기념비적인, 엄청난, 기념비의" },

      { en: "torture", ko: "고문(하다)" },
      { en: "contestant", ko: "참가자" },
      { en: "abolish", ko: "폐지하다" },
      { en: "abolition", ko: "폐지" },
      { en: "assassination", ko: "암살" },
      { en: "assassin", ko: "암살범" },
      { en: "assassinate", ko: "암살하다" },
      { en: "embassy", ko: "대사관" },
      { en: "ambassador", ko: "대사" },
      { en: "stream", ko: "흐름" },

      { en: "mainstream", ko: "주류" },
      { en: "bloodstream", ko: "혈류" },
      { en: "innate", ko: "타고난" },
      { en: "retrospect", ko: "회고(하다), 회상(하다)" },
      { en: "speculate", ko: "추측[심사숙고]하다" },
      { en: "prospect", ko: "전망, 가망성" },
      { en: "prospective", ko: "미래의, 가망이 있는" },
      { en: "inspect", ko: "검사[조사]하다" },
      { en: "specimen", ko: "표본, 견본" },
      { en: "rationalize", ko: "합리화하다" },

      { en: "tempt", ko: "유혹하다" },
      { en: "boom", ko: "호황, 인기" },
      { en: "booming", ko: "호황[인기]를 누리는" },
      { en: "imperial", ko: "황제의, 제국의" },
      { en: "saliva", ko: "침" },
      { en: "immemorial", ko: "아주 먼 옛날의" },
      { en: "imbalance", ko: "불균형" },
      { en: "insufficient", ko: "불충분한" },
      { en: "surge", ko: "급상승(하다), 밀려들다" },
      { en: "invest", ko: "투자하다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
