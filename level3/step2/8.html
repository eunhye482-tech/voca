<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "mess", ko: "엉망(으로 만들다)" },
      { en: "breakdown", ko: "고장, 붕괴, 쇠약" },
      { en: "breakthrough", ko: "돌파구" },
      { en: "mock", ko: "조롱하다" },
      { en: "deformed", ko: "기형의" },
      { en: "entail", ko: "수반하다" },
      { en: "cozy", ko: "편안한, 안락한" },
      { en: "rear", ko: "기르다, 양육하다, 뒤쪽의" },
      { en: "inaccessible", ko: "접근하기 어려운" },
      { en: "via", ko: "통해서, 경유해서" },

      { en: "chamber", ko: "회의실, ~실, 방" },
      { en: "worship", ko: "숭배(하다)" },
      { en: "scatter", ko: "흩뿌리다, 분산시키다, 흩어지다" },
      { en: "metropolis", ko: "대도시, 주요도시, 수도" },
      { en: "metropolitan", ko: "대도시의, 수도의" },
      { en: "remote", ko: "외딴, 멀리 떨어진, 원격의" },
      { en: "scholar", ko: "학자, 장학생" },
      { en: "scholarly", ko: "학문적인, 학자다운" },
      { en: "scholarship", ko: "장학금" },
      { en: "enlist", ko: "입대하다, 요청하다" },

      { en: "treaty", ko: "조약, 협정" },
      { en: "outgrow", ko: "(보다) 더 커지다[맞지 않게 되다]" },
      { en: "tissue", ko: "(세포)조직" },
      { en: "dread", ko: "두려워하다" },
      { en: "dreadful", ko: "무서운, 끔찍한" },
      { en: "undo", ko: "원상태로 돌리다, 풀다, 열다" },
      { en: "shed", ko: "흘리다, 떨어뜨리다, 비추다, 벗다, 헛간" },
      { en: "ground", ko: "이유, 근거, 입장, 의견" },
      { en: "trunk", ko: "(코끼리의) 코" },
      { en: "province", ko: "지방, 영역" },

      { en: "reckless", ko: "무모한" },
      { en: "stock", ko: "주식, 재고" },
      { en: "livestock", ko: "가축" },
      { en: "initiate", ko: "시작하다, 가르치다" },
      { en: "initiative", ko: "진취성, 주도권" },
      { en: "accuse", ko: "비난[고소]하다" },
      { en: "accusation", ko: "비난, 고소" },
      { en: "pole", ko: "막대기, 기둥, 극(지방)" },
      { en: "polar", ko: "극지방의, 북극의, 남극의" },
      { en: "puberty", ko: "사춘기" },

      { en: "sip", ko: "한 모금(씩 홀짝홀짝 마시다)" },
      { en: "frost", ko: "서리" },
      { en: "absorbed", ko: "열중한" },
      { en: "absorption", ko: "흡수" },
      { en: "spare", ko: "여가의, 여분의, 남는, 할애하다, 내어 주다, 덜어주다" },
      { en: "accustom", ko: "익숙하게 하다" },
      { en: "freight", ko: "화물(운송)" },
      { en: "prompt", ko: "촉발[유발]하다, 즉각적인" },
      { en: "strain", ko: "긴장감, 부담, 피로" },
      { en: "constrain", ko: "강요[제한]하다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
