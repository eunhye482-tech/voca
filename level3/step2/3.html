<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "patronize", ko: "단골로 삼다, 후원하다" },
      { en: "patronage", ko: "후원" },
      { en: "stimulate", ko: "자극[격려]하다" },
      { en: "temporary", ko: "일시적인, 임시의" },
      { en: "contemporary", ko: "현대의[동시대의]" },
      { en: "permanent", ko: "영구적인, 영원한" },
      { en: "utter", ko: "완전한, 말을 하다" },
      { en: "instruction", ko: "지시, 교육, 사용설명서" },
      { en: "certify", ko: "증명[보증]하다" },
      { en: "certificate", ko: "증명서, 자격증" },

      { en: "oppress", ko: "억압하다" },
      { en: "oppression", ko: "억압" },
      { en: "intact", ko: "손상되지 않은, 온전한" },
      { en: "rage", ko: "격노, 격한 분노" },
      { en: "implement", ko: "실행하다, 도구" },
      { en: "deplete", ko: "고갈[격감]시키다" },
      { en: "delete", ko: "삭제하다" },
      { en: "supplement", ko: "보충(하다), 부록" },
      { en: "supplementary", ko: "보충의, 추가의" },
      { en: "excursion", ko: "소풍, 여행" },

      { en: "reluctant", ko: "꺼려하는" },
      { en: "wrinkle", ko: "주름(지다), 찡그리다" },
      { en: "cutback", ko: "삭감, 감축" },
      { en: "utmost", ko: "최대한의, 최고의, 최선의" },
      { en: "proficient", ko: "능숙한" },
      { en: "sacred", ko: "신성한" },
      { en: "sacrifice", ko: "제물(로 바치다), 희생(하다)" },
      { en: "infected", ko: "감염된" },
      { en: "artifact", ko: "공예품, 인공물, 유물" },
      { en: "defect", ko: "결함, 결점" },

      { en: "sufficient", ko: "충분한" },
      { en: "magnify", ko: "확대[과장]하다" },
      { en: "magnificent", ko: "훌륭한, 웅장한" },
      { en: "temper", ko: "성질, 화" },
      { en: "garment", ko: "의류" },
      { en: "portrayal", ko: "묘사" },
      { en: "pose", ko: "자세(를 취하다), 제기하다, ~인체 하다" },
      { en: "dispose", ko: "처리하다, 배치하다" },
      { en: "disposal", ko: "배치, 처분" },
      { en: "disposable", ko: "일회용(의)" },

      { en: "disposed", ko: "마음이 있는" },
      { en: "irrigate", ko: "물을 대다, 관개하다" },
      { en: "supernatural", ko: "초자연적인" },
      { en: "interpersonal", ko: "대인관계의" },
      { en: "interchange", ko: "교환(하다), 분기점" },
      { en: "interrogate", ko: "심문[질문]하다" },
      { en: "advocate", ko: "주장[지지]하다, 옹호자, 변호사" },
      { en: "advocacy", ko: "지지, 변호" },
      { en: "affection", ko: "애정" },
      { en: "affectionate", ko: "애정 어린, 상냥한" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
