<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "scrutinize", ko: "철저하게 검토하다" },
      { en: "distract", ko: "산만하게 하다" },
      { en: "deliberate", ko: "의도적인, 신중한" },
      { en: "dusk", ko: "해질녘" },
      { en: "martial", ko: "군대의(전쟁의, 호전적인)" },
      { en: "martial arts", ko: "무술" },
      { en: "compromise", ko: "타협(하다), 손상시키다" },
      { en: "cannon", ko: "대포" },
      { en: "sake", ko: "이익(목적)" },
      { en: "comprise", ko: "구성하다(포함하다)" },

      { en: "gorgeous", ko: "매력적인(화려한)" },
      { en: "synchronize", ko: "동시에 발생하다" },
      { en: "chronic", ko: "만성적인" },
      { en: "humiliate", ko: "굴욕감을 준다" },
      { en: "humiliation", ko: "창피함(굴욕감)" },
      { en: "stuck", ko: "꼼작 못하는" },
      { en: "efficiency", ko: "효율(능력)" },
      { en: "exclusive", ko: "독점적인" },
      { en: "assemble", ko: "모으다(모이다), 조립하다" },
      { en: "assembly", ko: "조립, 집회, 의회" },

      { en: "engage", ko: "종사(참여)하다, (관심 주의)를 끌다, 고용하다, 약속하다" },
      { en: "engaged", ko: "약혼중인, (종사)하고있는, 몰두한" },
      { en: "integrate", ko: "통합하다" },
      { en: "integration", ko: "통합" },
      { en: "integral", ko: "필수적인" },
      { en: "engagement", ko: "참여" },
      { en: "pollutant", ko: "오염물질" },
      { en: "ritual", ko: "의식(의례, 절차)" },
      { en: "manufacture", ko: "제조(하다)" },
      { en: "manufacturer", ko: "제조업자" },

      { en: "manipulate", ko: "조작하다" },
      { en: "manifest", ko: "명백한, 나타나다" },
      { en: "staple", ko: "주요한(주요 산물)" },
      { en: "creed", ko: "신념(원칙, 교리)" },
      { en: "creep", ko: "몰래(살금살금) 움직이다" },
      { en: "distort", ko: "왜곡하다(비틀다)" },
      { en: "distortion", ko: "왜곡(비틀림)" },
      { en: "elaborate", ko: "정교한, 상세히 말하다" },
      { en: "nutrition", ko: "영양분" },
      { en: "nutritious", ko: "영양가 있는" },

      { en: "malnutrition", ko: "영양실조" },
      { en: "weave", ko: "짜다(뜨다), 엮다" },
      { en: "saliva", ko: "침" },
      { en: "dimension", ko: "크기(규모, 치수), 차원" },
      { en: "malice", ko: "악의(나쁜 의도)" },
      { en: "malicious", ko: "악의적인" },
      { en: "maltreat", ko: "학대하다" },
      { en: "malfunction", ko: "기능불량(오작동)" },
      { en: "inhibit", ko: "금지(방해하다)" },
      { en: "inhabit", ko: "살다(거주하다)" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
