<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "inhabitant", ko: "거주자(주민)" },
      { en: "embrace", ko: "포옹하다, 받아들이다(수용하다)" },
      { en: "refrain", ko: "삼가다(그만두다)" },
      { en: "pedestrian", ko: "보행자" },
      { en: "expedition", ko: "탐험(대)" },
      { en: "quarter", ko: "지역(구역, 숙소)" },
      { en: "headquarters", ko: "본부" },
      { en: "trunk", ko: "줄기(몸통), 여행용 가방" },
      { en: "pasture", ko: "목장" },
      { en: "posture", ko: "자세" },

      { en: "illuminate", ko: "비추다(조명하다, 밝히다)" },
      { en: "ware", ko: "제품(물품)" },
      { en: "warehouse", ko: "창고" },
      { en: "beware", ko: "조심하다" },
      { en: "domestic", ko: "가정의, 국내의, 길들여진" },
      { en: "domesticate", ko: "길들이다" },
      { en: "enhance", ko: "향상시키다" },
      { en: "trim", ko: "다듬다(장식하다)" },
      { en: "real estate", ko: "부동산" },
      { en: "glow", ko: "빛, 빛나다, 발개지다(상기되다)" },

      { en: "reign", ko: "통치(하다)" },
      { en: "sovereign", ko: "자주적인(독립적인), 군주(왕)" },
      { en: "hinder", ko: "방해하다" },
      { en: "hindrance", ko: "장애(물), 방해(물)" },
      { en: "narrate", ko: "이야기하다" },
      { en: "narrative", ko: "이야기의" },
      { en: "cosmetic", ko: "화장품, 성형의(미용의)" },
      { en: "mortal", ko: "죽을 운명의, 치명적인" },
      { en: "immortal", ko: "불멸의" },
      { en: "mortality", ko: "사망률" },

      { en: "suburban", ko: "교외의" },
      { en: "mobilize", ko: "동원하다" },
      { en: "seal", ko: "밀봉(봉인)하다, 물개(바다 표범), 도장" },
      { en: "ethic(s)", ko: "윤리" },
      { en: "fluctuate", ko: "오르내리다" },
      { en: "fluctuation", ko: "등락(오르내림, 변동)" },
      { en: "temperate", ko: "온화한, 절제하는(삼가는)" },
      { en: "temperance", ko: "금주(절제)" },
      { en: "temperament", ko: "기질" },
      { en: "contend", ko: "싸우다(경쟁하다), 주장하다" },

      { en: "regardless of", ko: "~ 에 상관없이" },
      { en: "regarding", ko: "~ 에 관하여" },
      { en: "disregard", ko: "무시하다" },
      { en: "priest", ko: "성직자(신부)" },
      { en: "exceed", ko: "초과하다" },
      { en: "fraud", ko: "사기(꾼)" },
      { en: "dictate", ko: "명령하다, 받아쓰게 하다" },
      { en: "dedicate", ko: "헌신하다(바치다)" },
      { en: "dedication", ko: "헌신(신념)" },
      { en: "dedicated", ko: "헌신적인, 전용의" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
