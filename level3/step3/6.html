<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "analogy", ko: "유사점(비유)" },
      { en: "testify", ko: "증언(증명)하다" },
      { en: "applicant", ko: "신청자(지원자)" },
      { en: "application", ko: "적용(응용), 신청, 바름" },
      { en: "appliance", ko: "제품(기기)" },
      { en: "subdue", ko: "억제(정복)하다" },
      { en: "frequency", ko: "빈도(횟수), 주파수" },
      { en: "cognition", ko: "인식(인지)" },
      { en: "cognitive", ko: "인지의(인식의)" },
      { en: "grin", ko: "활짝 웃다(씩 웃다)" },

      { en: "grip", ko: "꽉 쥐다" },
      { en: "stance", ko: "자세 (입장, 태도)" },
      { en: "substance", ko: "물질, 본질" },
      { en: "substantial", ko: "실질적인(본질적인), 상당한" },
      { en: "marine", ko: "해양의(바다의 , 해병대)" },
      { en: "disinterested", ko: "공평한(사심이 없는)" },
      { en: "uninterested", ko: "무관심한" },
      { en: "diagnose", ko: "진단하다" },
      { en: "diagnosis", ko: "진단" },
      { en: "dialect", ko: "사투리" },

      { en: "diaper", ko: "기저귀" },
      { en: "adverse", ko: "불리한(부정적인), 반대의" },
      { en: "adversity", ko: "역경" },
      { en: "adversary", ko: "적(상대)" },
      { en: "gender", ko: "성(별)" },
      { en: "submarine", ko: "잠수함" },
      { en: "perspective", ko: "관점(시각)" },
      { en: "perish", ko: "죽다(소멸하다)" },
      { en: "revenue", ko: "수입(수익)" },
      { en: "prosper", ko: "번창하다" },

      { en: "prosperity", ko: "번영(번창, 부유함)" },
      { en: "prosperous", ko: "번영하는(부유한)" },
      { en: "conceive", ko: "생각해내다(상상하다), 임신하다" },
      { en: "deceive", ko: "속이다" },
      { en: "conception", ko: "생각(구상, 임신)" },
      { en: "preconceived", ko: "미리 구상된" },
      { en: "misconception", ko: "오해" },
      { en: "preview", ko: "시사회(예고편)" },
      { en: "preliminary", ko: "예비적인(준비하는)" },
      { en: "precaution", ko: "예방조치" },

      { en: "premise", ko: "전제(조건)" },
      { en: "outdo", ko: "능가하다" },
      { en: "gene", ko: "유전자" },
      { en: "contain", ko: "포함하다, 억누르다" },
      { en: "retain", ko: "유지(보유)하다" },
      { en: "abstain", ko: "삼가다(그만두다)" },
      { en: "genuine", ko: "진정한(진실한)" },
      { en: "exquisite", ko: "세련된(정교한)" },
      { en: "perceptual", ko: "지각의(인식의)" },
      { en: "evoke", ko: "(불러)일으키다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
