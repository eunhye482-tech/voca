<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "enact", ko: "제정(규정)하다" },
      { en: "envision", ko: "상상하다(마음속에 그리다)" },
      { en: "enchant", ko: "매혹하다" },
      { en: "entrust", ko: "맡기다(위임하다)" },
      { en: "encircle", ko: "둘러싸다" },
      { en: "encode", ko: "기호(암호)로 바꾸다" },
      { en: "equation", ko: "방정식(등식, 동일시)" },
      { en: "equator", ko: "적도" },
      { en: "equivalent", ko: "동등한 (것)" },
      { en: "adequate", ko: "충분한(적절한)" },

      { en: "inadequate", ko: "부적절한" },
      { en: "equilibrium", ko: "평정(평형, 균형)" },
      { en: "prolific", ko: "다작하는(다산의, 풍성한)" },
      { en: "accompany", ko: "동반하다, 반주를 하다" },
      { en: "flourish", ko: "번창하다" },
      { en: "elegant", ko: "우아한" },
      { en: "triple", ko: "3배인(3개로 구성된)" },
      { en: "wholesale", ko: "도매의" },
      { en: "retail", ko: "소매의" },
      { en: "wholesaler", ko: "도매상" },

      { en: "retailer", ko: "소매상" },
      { en: "appetite", ko: "식욕, 욕망" },
      { en: "command", ko: "명령, 내려다보다" },
      { en: "fellow", ko: "동료(친구, 녀석)" },
      { en: "remedy", ko: "치료(약), 해결책, 개선하다(고치다)" },
      { en: "fluently", ko: "유창하게" },
      { en: "sophisticated", ko: "정교한(세련된)" },
      { en: "craftsman", ko: "장인(공예가)" },
      { en: "static", ko: "고정된(정지된)" },
      { en: "rubbish", ko: "쓰레기" },

      { en: "handy", ko: "능숙한(다루기 쉬운)" },
      { en: "clumsy", ko: "서투른" },
      { en: "formula", ko: "공식(방법)" },
      { en: "scale", ko: "규모, 비늘, 저울, 등급" },
      { en: "questionnaire", ko: "질문지(설문지)" },
      { en: "consent", ko: "동의,합의,허락(하다)" },
      { en: "resent", ko: "분개하다" },
      { en: "resentful", ko: "분개하는" },
      { en: "resentment", ko: "분개" },
      { en: "consensus", ko: "합의(의견일치)" },

      { en: "murmur", ko: "속삭임(속삭이다, 중얼거리다)" },
      { en: "seduce", ko: "유혹하다(매혹시키다)" },
      { en: "seclude", ko: "격리(고립)시키다" },
      { en: "segregate", ko: "차별(분리)하다" },
      { en: "segregation", ko: "차별(분리)" },
      { en: "induce", ko: "유발(유도)하다" },
      { en: "deduct", ko: "빼다(공제하다)" },
      { en: "subtle", ko: "미묘한(감지하기 힘든)" },
      { en: "subtitle", ko: "자막, 부제(목)" },
      { en: "fossil", ko: "화석의" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
