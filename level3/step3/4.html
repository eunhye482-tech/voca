<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "dictator", ko: "독재자" },
      { en: "verdict", ko: "판결(결정)" },
      { en: "exceptional", ko: "뛰어난(예외적인)" },
      { en: "menace", ko: "위협(협박)" },
      { en: "wicked", ko: "사악한(짓궂은)" },
      { en: "devil", ko: "악마" },
      { en: "paraphrase", ko: "다른말로 바꾸어 표현하다" },
      { en: "parasite", ko: "기생충" },
      { en: "parallel", ko: "평행한, 유사성" },
      { en: "exploit", ko: "착취(이용)하다" },

      { en: "equality", ko: "평등" },
      { en: "cosmos", ko: "우주" },
      { en: "savage", ko: "야만적인" },
      { en: "punctual", ko: "시간을 엄수하는" },
      { en: "punctuality", ko: "시간 엄수" },
      { en: "ornament", ko: "장식(품), 장식하다" },
      { en: "camouflage", ko: "위장(감추다)" },
      { en: "scrub", ko: "문질러 닦다(청소하다)" },
      { en: "sensation", ko: "감각(느낌), 돌풍(놀라운일)" },
      { en: "sensational", ko: "선풍적인(인기를끄는)" },

      { en: "extraordinary", ko: "특별한" },
      { en: "dormitory", ko: "기숙사" },
      { en: "friction", ko: "마찰(충돌)" },
      { en: "fraction", ko: "일부(부분)" },
      { en: "refraction", ko: "굴절" },
      { en: "fracture", ko: "골절" },
      { en: "console", ko: "위로, 위안하다" },
      { en: "consolation", ko: "위로, 위안" },
      { en: "communism", ko: "공산주의" },
      { en: "potent", ko: "강력한(효능있는)" },

      { en: "mourn", ko: "슬퍼하다" },
      { en: "gymnasium", ko: "체육관" },
      { en: "gymnastics", ko: "체조(체육)" },
      { en: "famine", ko: "기근(굶주림)" },
      { en: "persevere", ko: "인내하다" },
      { en: "perseverance", ko: "인내심" },
      { en: "skyscraper", ko: "고층건물" },
      { en: "vertical", ko: "수직의" },
      { en: "horizon", ko: "수평선(지평선), 시야 (범위)" },
      { en: "mediate", ko: "조정 중재하다" },

      { en: "meditate", ko: "심사숙고(명상)하다" },
      { en: "mediation", ko: "중재" },
      { en: "meditation", ko: "명상" },
      { en: "medication", ko: "약물(치료)" },
      { en: "medieval", ko: "중세의" },
      { en: "valid", ko: "유효한, 타당한" },
      { en: "validity", ko: "타당성(유효성)" },
      { en: "feat", ko: "위업(위대한 업적, 묘기, 기술)" },
      { en: "recruit", ko: "모집하다" },
      { en: "shrug", ko: "으쓱하다" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
