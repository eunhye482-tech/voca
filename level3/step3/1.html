<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fefcf0;
      color: #212121;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 12px;
      margin-bottom: 12px;
      background-color: #fff8e1;
      border-radius: 14px;
      border: 2px solid #ffe082;
    }

    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      font-weight: 800;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #f57c00;
      margin-top: 4px;
      font-weight: 600;
    }

    .page-nav {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffe082;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-btn-group {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      line-height: 34px;
      text-align: center;
      border: 1.5px solid #f57c00;
      background-color: #ffffff;
      color: #f57c00;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #f57c00;
      color: #ffffff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #1b5e20;
      font-weight: bold;
    }

    .word-list {
      width: 100%;
    }

    .word-card {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .word-card:active {
      background-color: #fffde7;
    }

    .word-card.ko-mode {
      background-color: #e8f5e9;
      border-color: #1b5e20;
    }

    .idx-col {
      width: 28px;
      font-weight: bold;
      color: #9e9e9e;
      font-size: 0.85rem;
    }

    .word-card.ko-mode .idx-col {
      color: #1b5e20;
    }

    .text-col {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 700;
      color: #212121;
      padding: 0 8px;
      word-break: break-all;
    }

    .word-card.ko-mode .text-col {
      color: #1b5e20;
    }

    .icon-col {
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📖 초스피드 영단어 50</h1>
    <div class="sub-title">터치 시 발음 재생 + 영한 전환</div>
  </header>

  <div class="page-nav">
    <div class="page-btn-group" id="page-grid"></div>
    <div class="info-text">🔊 터치 시 발음</div>
  </div>

  <div class="word-list" id="word-list"></div>

  <footer>
    Chrome / Samsung Internet Optimized
  </footer>

  <script>
    var wordsData = [
      { en: "conspicuous", ko: "눈에 잘 띄는" },
      { en: "disgrace", ko: "수치(불명예)" },
      { en: "shrink", ko: "줄다(감소하다), 움츠러들다" },
      { en: "shrinkage", ko: "감소(수축)" },
      { en: "obstinate", ko: "고집 센" },
      { en: "sprain", ko: "삐다,접질림" },
      { en: "stain", ko: "얼룩(오점,더럽히다)" },
      { en: "sting", ko: "쏜다(찌르다,따끔거리다)" },
      { en: "stinging", ko: "찌르는(듯이 아픈)" },
      { en: "stingy", ko: "인색한" },

      { en: "stink", ko: "악취(가 나다)" },
      { en: "foster", ko: "촉진(육성)하다, 양육하다(기르다)" },
      { en: "fragrance", ko: "향기" },
      { en: "fragrant", ko: "향기로운(즐거운)" },
      { en: "pregnant", ko: "임신한" },
      { en: "casualty", ko: "사상자(피해자)" },
      { en: "radioactive", ko: "방사능의" },
      { en: "discourse", ko: "담론,토론(하다)" },
      { en: "profess", ko: "주장, 공언, 고백하다" },
      { en: "gear", ko: "장비(의복), (맞게)조정하다" },

      { en: "disgust", ko: "역겨움(혐오감)" },
      { en: "segment", ko: "일부분(조각)" },
      { en: "converse", ko: "대화하다, 정반대(의)" },
      { en: "distinguished", ko: "유명한(두드러진)" },
      { en: "displease", ko: "불쾌하게 하다" },
      { en: "edible", ko: "먹을 수 있는" },
      { en: "inedible", ko: "먹을 수 없는" },
      { en: "lane", ko: "차선(좁은 길)" },
      { en: "metaphor", ko: "비유(은유)" },
      { en: "nanny", ko: "보모" },

      { en: "plunge", ko: "뛰어들다, 급락하다" },
      { en: "corrupt", ko: "부패한(타락한), 타락시키다" },
      { en: "erupt", ko: "분출(발발,폭발)하다" },
      { en: "eruption", ko: "폭발(분출)" },
      { en: "conversely", ko: "반대로" },
      { en: "agony", ko: "고통" },
      { en: "petition", ko: "탄원(서), 청원(서)" },
      { en: "stun", ko: "기절시키다(놀라게하다)" },
      { en: "stunned", ko: "놀란" },
      { en: "stunning", ko: "멋진(놀라움을 주는)" },

      { en: "haunt", ko: "출몰하다, 괴롭힌다" },
      { en: "supervise", ko: "감독(관리)하다" },
      { en: "supervision", ko: "관리(감독)" },
      { en: "supervisor", ko: "관리자(감독관)" },
      { en: "provision", ko: "제공(준비), 식량, 규정(조항)" },
      { en: "drought", ko: "가뭄" },
      { en: "imprison", ko: "감금(투옥)하다" },
      { en: "format", ko: "구성방식(형식, 체제)" },
      { en: "shatter", ko: "산산이 부수다" },
      { en: "scrutiny", ko: "철저한 검토" }
    ];

    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.log(e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      var html = '';
      for (var p = 1; p <= 5; p++) {
        var activeClass = (p === currentPage) ? ' active' : '';
        html += '<div class="page-btn' + activeClass + '" onclick="changePage(' + p + ')">' + p + '</div>';
      }
      grid.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderPageButtons();
      renderWords();
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;

      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);
      var html = '';

      for (var i = 0; i < pageWords.length; i++) {
        var globalIdx = start + i;
        var isKo = !!cardStates[globalIdx];
        var cardClass = isKo ? 'word-card ko-mode' : 'word-card';
        var wordText = isKo ? pageWords[i].ko : pageWords[i].en;
        var soundIcon = isKo ? '🇰🇷' : '🔊';

        html += '<div class="' + cardClass + '" onclick="clickCard(' + globalIdx + ', \'' + pageWords[i].en.replace(/'/g, "\\'") + '\')">' +
                  '<div class="idx-col">' + (globalIdx + 1) + '</div>' +
                  '<div class="text-col">' + wordText + '</div>' +
                  '<div class="icon-col">' + soundIcon + '</div>' +
                '</div>';
      }
      list.innerHTML = html;
    }

    function clickCard(idx, enText) {
      cardStates[idx] = !cardStates[idx];
      speakWord(enText);
      renderWords();
    }

    renderPageButtons();
    renderWords();
  </script>
</body>
</html>
