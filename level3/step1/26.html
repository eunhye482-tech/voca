    var currentPage = 1;
    var cardStates = {};

    function speakWord(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {
        console.log("TTS Error:", e);
      }
    }

    function renderPageButtons() {
      var grid = document.getElementById('page-grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (var p = 1; p <= 5; p++) {
        (function(pageNum) {
          var btn = document.createElement('button');
          btn.className = 'page-btn ' + (pageNum === currentPage ? 'active' : '');
          btn.innerText = pageNum;
          btn.onclick = function() {
            currentPage = pageNum;
            renderPageButtons();
            renderWords();
          };
          grid.appendChild(btn);
        })(p);
      }
    }

    function renderWords() {
      var list = document.getElementById('word-list');
      if (!list) return;
      list.innerHTML = '';
      var start = (currentPage - 1) * 10;
      var pageWords = wordsData.slice(start, start + 10);

      pageWords.forEach(function(wordObj, idx) {
        var globalIdx = start + idx;
        var isKoMode = !!cardStates[globalIdx];
        var card = document.createElement('div');
        card.className = 'word-card ' + (isKoMode ? 'ko-mode' : '');
        card.innerHTML = 
          '<span class="word-index">' + (globalIdx + 1) + '</span>' +
          '<span class="word-text">' + (isKoMode ? wordObj.ko : wordObj.en) + '</span>' +
          '<span class="sound-icon">' + (isKoMode ? '🇰🇷' : '🔊') + '</span>';

        card.onclick = function() {
          speakWord(wordObj.en);
          cardStates[globalIdx] = !cardStates[globalIdx];
          renderWords();
        };
        list.appendChild(card);
      });
    }

    function initApp() {
      renderPageButtons();
      renderWords();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
