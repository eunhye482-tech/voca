<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>English Master 5-1</title>
    <style>
        :root { --yellow-light: #FFFDE7; --yellow-pale: #FFF9C4; --yellow-main: #FBC02D; --yellow-dark: #F57F17; --pink-soft: #FFF5F7; --text-dark: #5D4037; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: #FFFEF0; display: flex; justify-content: center; min-height: 100vh; }
        .phone-container { width: 100%; max-width: 450px; background: white; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .header { padding: 12px; text-align: center; font-weight: bold; color: var(--yellow-dark); border-bottom: 1px solid var(--yellow-pale); background: white; font-size: 0.95rem; position: sticky; top: 0; z-index: 10; }
        #display-area { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .btn-next { background: var(--yellow-main); color: var(--text-dark); padding: 16px; border-radius: 15px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .btn-step3 { background: #FFF59D; color: var(--text-dark); padding: 16px; border-radius: 15px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; border: 2px solid var(--yellow-main); }
        .main-title-card { width: 100%; background: var(--yellow-main); padding: 25px 15px; border-radius: 20px; color: var(--text-dark); margin-bottom: 20px; text-align: center; }
        .main-title-card h1 { margin: 0; font-size: 1.4rem; font-weight: 900; line-height: 1.3; }
        .structure-container { background: var(--yellow-light); border: 2px solid var(--yellow-pale); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .struct-item { margin-bottom: 18px; border-bottom: 1px dashed var(--yellow-pale); padding-bottom: 10px; }
        .struct-item:last-child { border: none; }
        .struct-label { font-weight: 900; color: #E65100; font-size: 0.95rem; display: block; margin-bottom: 6px; }
        .struct-text { font-size: 0.9rem; line-height: 1.6; font-weight: 500; text-align: justify; }
        .topic-area { background: var(--pink-soft); border: 2px solid #F8BBD0; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 10px; }
        .topic-kor { font-weight: bold; color: #333; font-size: 1rem; display: block; margin-bottom: 8px; }
        .topic-eng { font-size: 0.85rem; color: #666; font-style: italic; display: block; }
        .sentence-box { background: var(--yellow-light); padding: 20px; border-radius: 20px; font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 15px; border: 2px solid var(--yellow-pale); text-align: center; cursor: pointer; line-height: 1.5; }
        .kor-box { background: #FFF5F7; padding: 20px; border-radius: 20px; font-size: 0.95rem; font-weight: 600; color: #D81B60; margin-bottom: 15px; border: 2px solid #F8BBD0; text-align: center; line-height: 1.6; }
        .voca-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .voca-item { background: #fff; padding: 10px; border-radius: 10px; font-size: 0.82rem; border: 1px solid var(--yellow-pale); cursor: pointer; text-align: center; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .voca-item.revealed { background: var(--yellow-main); color: var(--text-dark); }
        .blank-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 20px; padding: 10px; background: #fdfdfd; border-radius: 15px; }
        .word-blank { border-bottom: 2px solid var(--yellow-main); min-width: 35px; text-align: center; font-size: 1rem; color: transparent; cursor: pointer; padding: 0 2px; }
        .word-blank.revealed { color: var(--text-dark); border-bottom-color: transparent; font-weight: bold; }
        .btn-check { background: #f0f0f0; padding: 12px; border-radius: 12px; border: none; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .trans-content { display: none; padding: 15px; background: #fafafa; border-radius: 15px; border-left: 5px solid var(--yellow-main); font-size: 0.9rem; margin-bottom: 10px; }
        .nav-btns-fixed { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; position: sticky; bottom: 0; }
        .btn-prev { background: #F5F5F5; color: #718096; padding: 16px; border-radius: 15px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; width: 30%; margin-right: 10px; }
    </style>
</head>
<body>
<div class="phone-container">
    <div class="header" id="header-title">English Master 5-1</div>
    <div id="display-area"></div>
    <div id="nav-area" class="nav-btns-fixed hidden">
        <button class="btn-prev" onclick="prevSentence()">PREV</button>
        <button class="btn-next" onclick="nextSentence()" id="main-next-btn">NEXT</button>
    </div>
</div>
<script>
    const fullData = [
        { en: "The new millennium has brought discoveries about dolphin cognition, emotion, and consciousness, creating a bridge to what is known about dolphin behavior with an emphasis on communication.", ko: "새로운 천년기는 돌고래의 인지, 감정, 그리고 의식에 대한 발견을 가져왔으며, 의사소통에 중점을 둔 돌고래의 행동에 대해 알려진 것들로 연결되는 다리를 놓아주었습니다.", voca: ["millennium:천년기", "discoveries:발견", "cognition:인지", "consciousness:의식", "emphasis:강조", "communication:의사소통", "🍎", "🍎", "🍎", "🍎"] },
        { en: "New data on dolphin intelligence allow us to obtain a broader picture of the inner lives of dolphins.", ko: "돌고래 지능에 대한 새로운 데이터는 돌고래의 내면적 삶에 대한 더 넓은 그림을 얻을 수 있게 해 줍니다.", voca: ["intelligence:지능", "obtain:얻다", "broader:더 넓은", "inner lives:내면의 삶", "picture:그림/모습", "🍎", "🍎", "🍎", "🍎", "🍎"] },
        { en: "We see that dolphins exhibit sophisticated characteristics previously attributed only to humans and possibly to other higher primates.", ko: "우리는 돌고래들이 이전에는 오직 인간이나 아마도 다른 고등 영장류의 것으로만 여겨졌던 정교한 특성들을 보여준다는 것을 알게 됩니다.", voca: ["exhibit:보여주다", "sophisticated:정교한", "characteristics:특성", "previously:이전에", "attributed to:~의 탓으로 여겨지는", "higher primates:고등 영장류", "🍎", "🍎", "🍎", "🍎"] },
        { en: "We know that dolphins understand syntax, semantics, and word order, and are capable of mirror-self-recognition, comprehension of pointing gestures, and understanding reference to body parts.", ko: "우리는 돌고래가 구문론, 의미론, 그리고 어순을 이해하며, 거울 속 자기 인식, 가리키는 몸짓의 이해, 그리고 신체 부위에 대한 지칭을 이해할 수 있다는 것을 알고 있습니다.", voca: ["syntax:구문론", "semantics:의미론", "word order:어순", "capable of:~할 수 있는", "recognition:인식", "comprehension:이해", "gesture:몸짓", "reference:지칭", "🍎", "🍎"] },
        { en: "They can identify the same abstract object using vision or echolocation.", ko: "그들은 시각이나 반향 위치 측정을 사용하여 동일한 추상적 대상을 식별할 수 있습니다.", voca: ["identify:식별하다", "abstract:추상적인", "object:대상", "vision:시각", "echolocation:반향 위치 측정", "🍎", "🍎", "🍎", "🍎", "🍎"] },
        { en: "There is evidence that dolphins have culture.", ko: "돌고래에게 문화가 있다는 증거가 있습니다.", voca: ["evidence:증거", "culture:문화", "🍎", "🍎", "🍎", "🍎", "🍎", "🍎", "🍎", "🍎"] },
        { en: "For instance, killer whales have vocal dialects that are distinct to each family group and are passed down through generations; some bottlenose dolphins use sponges as tools when foraging along the sea floor.", ko: "예를 들어, 범고래는 각 가족 집단마다 뚜렷하고 세대를 통해 전해 내려오는 음성 방언을 가지고 있으며, 일부 큰돌고래는 해저에서 먹이를 찾을 때 스펀지를 도구로 사용합니다.", voca: ["instance:예시", "dialects:방언", "distinct:뚜렷한", "passed down:전해 내려오는", "generations:세대", "foraging:먹이 찾기", "bottlenose:병코(돌고래)", "🍎", "🍎", "🍎"] }
    ];
    let currentMode = 'INTRO'; let currentIdx = 0; const synth = window.speechSynthesis;
    function render() {
        const area = document.getElementById('display-area'); const nav = document.getElementById('nav-area'); const header = document.getElementById('header-title'); area.innerHTML = '';
        if (currentMode === 'INTRO') {
            header.innerText = "Step 1. Overview"; nav.classList.add('hidden');
            area.innerHTML = `<div class="main-title-card"><h1>The Inner Lives and Culture of Dolphins</h1></div>
                <div class="structure-container">
                    <div class="struct-item"><span class="struct-label">📍 서론: 돌고래 지능 연구의 새로운 지평</span><div class="struct-text">21세기 들어 돌고래의 인지와 의식에 대한 연구가 활발해지며, 단순한 행동 분석을 넘어 그들의 내면적 삶을 이해하게 되었습니다.</div></div>
                    <div class="struct-item"><span class="struct-label">📍 본론: 인간과 닮은 고도의 지적 능력</span><div class="struct-text">돌고래는 문법과 어순을 이해하고 거울 속의 자신을 알아보는 등, 과거 인간만의 영역으로 여겨졌던 고등 지능과 추상적 사고 능력을 갖추고 있습니다.</div></div>
                    <div class="struct-item"><span class="struct-label">📍 결론: 돌고래 사회의 문화적 요소</span><div class="struct-text">가족별 방언을 전수하는 범고래나 도구를 사용하는 큰돌고래의 사례는 그들이 세대를 거쳐 지식을 전달하는 고유의 문화를 가지고 있음을 증명합니다.</div></div>
                </div>
                <div class="topic-area"><span class="topic-kor">고도의 언어 이해력, 자기 인식, 도구 사용 및 세대 간 지식 전수 문화를 갖춘 돌고래의 지적 특성</span><span class="topic-eng">The intellectual characteristics of dolphins, featuring advanced linguistic comprehension, self-recognition, tool use, and cultural transmission.</span></div>
                <button class="btn-next" onclick="startStep(2)">STEP 2: 문장 학습 시작 ▶</button><button class="btn-step3" onclick="startStep(3)">STEP 3: 영작 연습 시작 ▶</button>`;
        } else {
            const stepNum = currentMode === 'STEP2' ? 2 : 3; header.innerText = `STEP ${stepNum}. (${currentIdx + 1}/${fullData.length})`; nav.classList.remove('hidden'); document.getElementById('main-next-btn').innerText = (currentIdx === fullData.length - 1) ? "FINISH" : "NEXT";
            const item = fullData[currentIdx];
            if (currentMode === 'STEP2') {
                area.innerHTML = `<div class="sentence-box" onclick="playTTS('${item.en.replace(/'/g, "\\'")}')">${item.en}</div><div class="voca-grid" id="voca-area"></div><button class="btn-check" onclick="toggleView('trans-area')">해석 확인하기</button><div id="trans-area" class="trans-content">${item.ko}</div>`; fillVoca(item.voca);
            } else {
                area.innerHTML = `<div class="kor-box">${item.ko}</div><div class="blank-area" id="blank-area"></div><div class="voca-grid" id="voca-area"></div><button class="btn-check" onclick="toggleView('trans-area')">정답 확인하기</button><div id="trans-area" class="trans-content">${item.en}</div>`; fillBlanks(item.en); fillVoca(item.voca);
            }
        }
    }
    function fillVoca(v) { const c = document.getElementById('voca-area'); v.forEach(i => { const d = document.createElement('div'); d.className = 'voca-item'; if(i!=='🍎'){ const [e,k]=i.split(':'); d.innerText=e; d.onclick=function(){this.classList.toggle('revealed');this.innerText=this.classList.contains('revealed')?k:e;}; }else{ d.innerText='🍎';d.style.color="#FF3B30"; } c.appendChild(d); }); }
    function fillBlanks(s) { const c = document.getElementById('blank-area'); s.split(' ').forEach(w => { const sp = document.createElement('span'); sp.className = 'word-blank'; sp.innerText = w; sp.onclick = function() { this.classList.add('revealed'); playTTS(w.replace(/[.,'"]/g, "")); }; c.appendChild(sp); }); }
    function startStep(s) { currentMode = 'STEP' + s; currentIdx = 0; render(); }
    function nextSentence() { if (currentIdx < fullData.length - 1) { currentIdx++; render(); } else { currentMode = 'INTRO'; render(); } }
    function prevSentence() { if (currentIdx > 0) { currentIdx--; render(); } else { currentMode = 'INTRO'; render(); } }
    function playTTS(t) { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9; synth.speak(u); }
    function toggleView(id) { const el = document.getElementById(id); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; }
    window.onload = render;
</script>
</body>
</html>
